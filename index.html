<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挣钱上三亚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{
    margin:0;
    min-height:100vh;
    background:
        linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1400&q=80');
    background-size:cover;background-attachment:fixed;
}
.container{max-width:1250px;margin:20px auto;padding:16px}
.form-box{background:#ffffffdd;padding:22px;border-radius:10px;margin-bottom:20px;box-shadow:0 1px 6px #00000022}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.item{display:flex;flex-direction:column;gap:4px}
input,select{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;min-width:142px}
button{padding:8px 12px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:13px}
button:hover{background:#1d4ed8}
.btn-del{background:#dc2626}
.btn-toggle-del{background:#059669}
table{width:100%;border-collapse:collapse;background:#ffffffdd;border-radius:8px;overflow:hidden;box-shadow:0 1px 6px #00000020}
th,td{border:1px solid #e2e8f0;padding:9px 10px;font-size:13px}
th{background:#dbeafe}
.total-bar{padding:12px;background:#dbeafecc;border-radius:8px;margin:10px 0;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<div class="container">
    <h2>挣钱上三亚</h2>
    <div class="form-box">
        <div class="row">
            <div class="item">
                <label>售卖日期</label>
                <input type="date" id="sellDate">
            </div>
            <div class="item">
                <label>截止日期</label>
                <input type="date" id="expireDate">
            </div>
            <div class="item">
                <label>售卖价格(元)</label>
                <input type="number" id="price" placeholder="输入金额">
            </div>
            <div class="item">
                <label>买家邮箱</label>
                <input type="text" id="buyerEmail" placeholder="买家邮箱">
            </div>
            <div class="item">
                <label>项目号</label>
                <input type="text" id="projectNo" placeholder="项目编号">
            </div>
            <div class="item">
                <label>操作人</label>
                <select id="operator">
                    <option value="崔囤月">崔囤月</option>
                    <option value="刘俊屹">刘俊屹</option>
                    <option value="曾安南" selected>曾安南</option>
                </select>
            </div>
        </div>
        <div class="row">
            <button id="btnAdd">新增记录</button>
            <button id="btnExport">导出备份(CSV)</button>
        </div>
    </div>

    <div class="total-bar" id="totalBar">合计（共0条） ¥0.00</div>
    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>售卖日期</th>
                <th>截止日期</th>
                <th>售价(元)</th>
                <th>买家邮箱</th>
                <th>项目号</th>
                <th>是否已删除</th>
                <th>操作人</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
const SUPABASE_URL = "https://fhbqgieahzkdonknkotg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0hgg6udla0_K8P-1pIliCg_pXElMix-";

// 只执行一次createClient，杜绝重复声明
let supabase;
document.addEventListener('DOMContentLoaded', async function () {
    const { createClient } = window.supabase;
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tableBody = document.getElementById('tableBody');
    const totalBar = document.getElementById('totalBar');

    const sellDateEl = document.getElementById('sellDate');
    const expireDateEl = document.getElementById('expireDate');
    const priceEl = document.getElementById('price');
    const buyerEmailEl = document.getElementById('buyerEmail');
    const projectNoEl = document.getElementById('projectNo');
    const operatorEl = document.getElementById('operator');
    const btnAdd = document.getElementById('btnAdd');
    const btnExport = document.getElementById('btnExport');


    async function loadData(){
        console.log("读取数据");
        const {data,error} = await supabase
            .from('records')
            .select('*')
            .order('expireDate', {ascending:true});

        if(error){
            console.error("读取错误",error);
            return;
        }
        renderTable(data);
    }

    function renderTable(list){
        tableBody.innerHTML = "";
        let sum = 0;
        list.forEach((row,idx)=>{
            sum += Number(row.price||0);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${idx+1}</td>
                <td>${row.sellDate||''}</td>
                <td>${row.expireDate||''}</td>
                <td>${row.price||0}</td>
                <td>${row.buyerEmail||''}</td>
                <td>${row.project_no||''}</td>
                <td>${row.is_deleted||"未删除"}</td>
                <td>${row.operator||''}</td>
                <td>
                    <button class="btn-toggle-del" data-id="${row.id}" data-status="${row.is_deleted||'未删除'}">切换删除状态</button>
                    <button class="btn-del" data-id="${row.id}">删除整行</button>
                </td>
            `;
            tableBody.appendChild(tr);
        })
        totalBar.innerText = `合计（共${list.length}条） ¥${sum.toFixed(2)}`;

        document.querySelectorAll('.btn-toggle-del').forEach(btn=>{
            btn.onclick = async function(){
                const rid = Number(this.dataset.id);
                const currStatus = this.dataset.status;
                const newStatus = currStatus === "未删除" ? "已删除" : "未删除";
                const {error} = await supabase.from('records')
                    .update({is_deleted: newStatus})
                    .eq('id', rid);
                if(error) console.error("更新状态失败",error);
                loadData();
            }
        })

        document.querySelectorAll('.btn-del').forEach(btn=>{
            btn.onclick = async function(){
                const rid = Number(this.dataset.id);
                await supabase.from('records').delete().eq('id',rid);
                loadData();
            }
        })
    }

    btnAdd.onclick = async function(){
        console.log("点击新增");
        const payload = {
            sellDate: sellDateEl.value,
            expireDate: expireDateEl.value,
            price: Number(priceEl.value||0),
            buyerEmail: buyerEmailEl.value.trim(),
            project_no: projectNoEl.value.trim(),
            operator: operatorEl.value
        }
        const {error} = await supabase.from('records').insert([payload]);
        if(error){
            console.error("新增错误",error);
            alert("新增失败:"+JSON.stringify(error));
            return;
        }
        sellDateEl.value = "";
        expireDateEl.value = "";
        priceEl.value = "";
        buyerEmailEl.value = "";
        projectNoEl.value = "";
        operatorEl.value = "曾安南";
        loadData();
    }

    btnExport.onclick = function(){
        const headers = ["序号","售卖日期","截止日期","售价(元)","买家邮箱","项目号","是否已删除","操作人"];
        let csvContent = headers.join(",") + "\n";
        const rows = Array.from(tableBody.querySelectorAll('tr'));
        rows.forEach(tr=>{
            const tds = Array.from(tr.querySelectorAll('td')).map(td=>'"'+td.innerText+'"');
            csvContent += tds.join(",") + "\n";
        })
        const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "挣钱上三亚_导出.csv";
        a.click();
    }

    loadData();
})
</script>
</body>
</html>
