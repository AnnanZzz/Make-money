<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>挣钱上三亚 · Sanya Dream</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   全局
========================================================= */

:root{
    --ink:#173039;
    --muted:#6f858a;

    --cream:#fffaf1;
    --cream2:#f6efe3;

    --aqua:#3bb9b3;
    --aqua-dark:#197e82;

    --gold:#d6ad68;
    --coral:#e98f7f;

    --whiteGlass:rgba(255,255,255,.76);
    --line:rgba(31,76,84,.12);

    --shadow:
        0 24px 70px rgba(42,79,84,.15);
}


*{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{
    margin:0;

    min-height:100vh;

    color:var(--ink);

    background:
        linear-gradient(
            180deg,
            #f7f4ec,
            #eef6f4
        );

    font-family:
        Inter,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        sans-serif;
}


/* =========================================================
   HERO 海岛区域
========================================================= */

.hero{
    position:relative;

    height:470px;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #ffd7b1 0%,
            #fce9cf 30%,
            #cceeed 55%,
            #55c8c7 56%,
            #14999e 100%
        );
}


/* =========================================================
   天空
========================================================= */

.sun{
    position:absolute;

    width:130px;
    height:130px;

    left:68%;
    top:68px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff8df 0%,
            #ffe5a7 45%,
            #ffc87f 100%
        );

    box-shadow:
        0 0 40px rgba(255,228,162,.8),
        0 0 110px rgba(255,195,111,.45);

    animation:
        sunFloat 7s ease-in-out infinite alternate;
}


@keyframes sunFloat{

    from{
        transform:
            translateY(0)
            scale(1);
    }

    to{
        transform:
            translateY(8px)
            scale(1.04);
    }

}


/* =========================================================
   云朵
========================================================= */

.cloud{
    position:absolute;

    height:35px;

    border-radius:100px;

    background:
        rgba(255,255,255,.64);

    filter:blur(.3px);

    opacity:.75;
}


.cloud::before,
.cloud::after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;
}


.cloud::before{
    width:55px;
    height:55px;

    left:20px;
    top:-28px;
}


.cloud::after{
    width:42px;
    height:42px;

    right:20px;
    top:-18px;
}


.cloud1{
    width:150px;

    left:-180px;
    top:75px;

    animation:
        cloudMove1 38s linear infinite;
}


.cloud2{
    width:110px;

    left:-140px;
    top:150px;

    transform:scale(.75);

    animation:
        cloudMove2 52s linear infinite;
}


@keyframes cloudMove1{

    from{
        left:-180px;
    }

    to{
        left:110%;
    }

}


@keyframes cloudMove2{

    from{
        left:-160px;
    }

    to{
        left:115%;
    }

}


/* =========================================================
   海平面
========================================================= */

.ocean{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:220px;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #34b7bb 0%,
            #15999f 45%,
            #067981 100%
        );
}


/* 阳光落在海面的反光 */

.sun-path{
    position:absolute;

    width:330px;
    height:250px;

    left:59%;
    top:-20px;

    transform:
        perspective(280px)
        rotateX(60deg);

    background:
        radial-gradient(
            ellipse,
            rgba(255,240,183,.68),
            rgba(255,226,157,.18) 35%,
            transparent 67%
        );

    filter:blur(6px);

    animation:
        shimmer 4s ease-in-out infinite alternate;
}


@keyframes shimmer{

    from{
        transform:
            translateX(-15px)
            perspective(280px)
            rotateX(60deg)
            scaleX(.85);
    }

    to{
        transform:
            translateX(15px)
            perspective(280px)
            rotateX(60deg)
            scaleX(1.1);
    }

}


/* =========================================================
   真正明显的动态波浪
========================================================= */

.wave{
    position:absolute;

    left:-50%;

    width:200%;

    border-radius:45%;

    transform-origin:center;
}


/* 最远层 */

.wave1{
    height:95px;

    top:38px;

    background:
        rgba(255,255,255,.16);

    animation:
        waveMove1 7s linear infinite;
}


/* 第二层 */

.wave2{
    height:120px;

    top:78px;

    background:
        rgba(255,255,255,.23);

    animation:
        waveMove2 9s linear infinite;
}


/* 第三层 */

.wave3{
    height:140px;

    top:115px;

    background:
        rgba(103,219,218,.50);

    animation:
        waveMove3 11s linear infinite;
}


/* 前景浪 */

.wave4{
    height:170px;

    top:150px;

    background:
        rgba(5,110,120,.72);

    animation:
        waveMove4 13s linear infinite;
}


@keyframes waveMove1{

    0%{
        transform:
            translateX(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateX(7%)
            rotate(1deg);
    }

    100%{
        transform:
            translateX(0)
            rotate(0deg);
    }

}


@keyframes waveMove2{

    0%{
        transform:
            translateX(7%)
            rotate(-1deg);
    }

    50%{
        transform:
            translateX(-4%)
            rotate(1deg);
    }

    100%{
        transform:
            translateX(7%)
            rotate(-1deg);
    }

}


@keyframes waveMove3{

    0%{
        transform:
            translateX(-5%)
            scaleY(.95);
    }

    50%{
        transform:
            translateX(5%)
            scaleY(1.08);
    }

    100%{
        transform:
            translateX(-5%)
            scaleY(.95);
    }

}


@keyframes waveMove4{

    0%{
        transform:
            translateX(3%)
            rotate(.5deg);
    }

    50%{
        transform:
            translateX(-5%)
            rotate(-.5deg);
    }

    100%{
        transform:
            translateX(3%)
            rotate(.5deg);
    }

}


/* =========================================================
   椰树
========================================================= */

.palm{
    position:absolute;

    z-index:9;

    bottom:-15px;

    transform-origin:bottom center;

    filter:
        drop-shadow(
            0 20px 22px rgba(19,73,70,.22)
        );
}


.palm-left{
    left:-20px;

    width:250px;
    height:360px;

    animation:
        palmLeft 4.8s ease-in-out infinite alternate;
}


.palm-right{
    right:-25px;

    width:210px;
    height:310px;

    transform:scaleX(-1);

    animation:
        palmRight 5.4s ease-in-out infinite alternate;
}


@keyframes palmLeft{

    from{
        transform:
            rotate(-2deg);
    }

    to{
        transform:
            rotate(3deg);
    }

}


@keyframes palmRight{

    from{
        transform:
            scaleX(-1)
            rotate(-2deg);
    }

    to{
        transform:
            scaleX(-1)
            rotate(2.5deg);
    }

}


.palm path{
    fill:#145e58;
}


/* =========================================================
   HERO 内容
========================================================= */

.hero-content{
    position:relative;

    z-index:20;

    width:min(
        1400px,
        calc(100% - 40px)
    );

    margin:auto;

    padding-top:70px;
}


.hero-tag{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        8px 13px;

    border-radius:999px;

    background:
        rgba(255,255,255,.45);

    border:
        1px solid rgba(255,255,255,.50);

    backdrop-filter:
        blur(16px);

    color:#336a6c;

    font-size:11px;

    letter-spacing:.14em;
}


.hero-tag-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#2eaaa5;

    box-shadow:
        0 0 12px #62d8cf;
}


.hero-title{
    margin:
        20px 0 0;

    font-size:
        clamp(
            54px,
            8vw,
            104px
        );

    line-height:.90;

    letter-spacing:-.07em;

    color:#17373b;

    font-weight:750;
}


.hero-title span{
    color:#fff9ec;

    text-shadow:
        0 8px 25px rgba(31,93,91,.15);
}


.hero-subtitle{
    margin-top:19px;

    font-size:15px;

    color:
        rgba(31,75,78,.77);

    letter-spacing:.03em;
}


/* =========================================================
   内容区域
========================================================= */

.app{
    position:relative;

    z-index:30;

    width:min(
        1400px,
        calc(100% - 34px)
    );

    margin:
        -45px auto
        80px;
}


/* =========================================================
   毛玻璃
========================================================= */

.glass{
    background:
        var(--whiteGlass);

    border:
        1px solid
        rgba(255,255,255,.85);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(28px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(125%);
}


/* =========================================================
   统计卡
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        1.55fr
        repeat(3,1fr);

    gap:14px;

    margin-bottom:16px;
}


.stat{
    min-height:150px;

    padding:22px;

    border-radius:24px;

    position:relative;

    overflow:hidden;

    transition:
        transform .26s ease,
        box-shadow .26s ease;
}


.stat:hover{
    transform:
        translateY(-6px);

    box-shadow:
        0 30px 75px
        rgba(44,91,94,.19);
}


.stat::after{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    right:-55px;
    bottom:-70px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(57,184,178,.16),
            transparent 67%
        );
}


.stat-label{
    font-size:10px;

    letter-spacing:.15em;

    color:#8aa0a3;
}


.stat-value{
    margin-top:13px;

    font-size:
        clamp(
            28px,
            3.8vw,
            48px
        );

    letter-spacing:-.045em;

    font-weight:730;

    color:#203e42;
}


.stat:first-child
.stat-value{
    color:#227e7d;
}


.stat-caption{
    margin-top:7px;

    font-size:12px;

    color:#8a9d9f;
}


/* =========================================================
   Panel
========================================================= */

.panel{
    margin-bottom:16px;

    padding:24px;

    border-radius:28px;
}


.panel-head{
    display:flex;

    justify-content:
        space-between;

    align-items:center;

    gap:15px;

    margin-bottom:20px;
}


.panel-title{
    display:flex;

    align-items:center;

    gap:12px;
}


.panel-icon{
    width:45px;
    height:45px;

    display:grid;

    place-items:center;

    border-radius:14px;

    color:#fff;

    font-size:22px;

    background:
        linear-gradient(
            145deg,
            #46c4bd,
            #238e94
        );

    box-shadow:
        0 12px 25px
        rgba(57,175,172,.22);
}


.panel-title h2,
.panel-title h3{
    margin:0;

    font-size:18px;

    color:#234349;
}


.panel-title p{
    margin:
        4px 0 0;

    font-size:11px;

    color:#91a2a4;
}


/* =========================================================
   表单
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(
            6,
            minmax(130px,1fr)
        );

    gap:11px;
}


.field{
    display:flex;

    flex-direction:column;

    gap:7px;
}


.field label{
    padding-left:3px;

    font-size:11px;

    font-weight:600;

    color:#7d9699;
}


.input,
.select{
    width:100%;

    height:48px;

    padding:
        0 14px;

    border-radius:14px;

    border:
        1px solid
        #dbe7e6;

    background:
        rgba(255,255,255,.70);

    color:#28484c;

    outline:none;

    font-size:13px;

    transition:.2s;
}


.input::placeholder{
    color:#acbcbd;
}


.input:focus,
.select:focus{
    border-color:#6fcac5;

    box-shadow:
        0 0 0 4px
        rgba(86,195,190,.11);

    background:#fff;
}


.form-actions{
    display:flex;

    gap:9px;

    margin-top:17px;
}


/* =========================================================
   Buttons
========================================================= */

.btn{
    min-height:44px;

    padding:
        0 17px;

    border:none;

    border-radius:13px;

    display:inline-flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    cursor:pointer;

    font-size:13px;

    font-weight:650;

    transition:.24s ease;
}


.btn-primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            #43c4bc,
            #208e95
        );

    box-shadow:
        0 11px 24px
        rgba(46,165,164,.21);
}


.btn-primary:hover{
    transform:
        translateY(-3px);

    box-shadow:
        0 17px 30px
        rgba(46,165,164,.30);
}


.btn-secondary{
    color:#46666a;

    background:
        rgba(255,255,255,.67);

    border:
        1px solid
        #dae7e6;
}


.btn-secondary:hover{
    transform:
        translateY(-2px);

    background:white;
}


/* =========================================================
   Toolbar
========================================================= */

.toolbar{
    display:flex;

    justify-content:
        space-between;

    align-items:center;

    gap:15px;

    margin-bottom:16px;
}


.toolbar-title h3{
    margin:0;

    color:#25474b;

    font-size:18px;
}


.toolbar-title p{
    margin:
        5px 0 0;

    font-size:11px;

    color:#91a4a6;
}


.toolbar-right{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}


.search-wrap{
    position:relative;
}


.search-wrap span{
    position:absolute;

    left:13px;

    top:50%;

    transform:
        translateY(-50%);

    color:#8ba3a5;
}


.search-input{
    width:260px;

    height:44px;

    padding:
        0 13px 0 39px;

    border-radius:14px;

    border:
        1px solid
        #dbe7e6;

    background:
        rgba(255,255,255,.67);

    outline:none;

    color:#345458;
}


/* =========================================================
   Table
========================================================= */

.table-wrap{
    overflow:auto;

    border-radius:18px;

    border:
        1px solid #e1ebea;

    background:
        rgba(255,255,255,.45);
}


table{
    width:100%;

    min-width:1100px;

    border-collapse:collapse;
}


th{
    padding:
        13px 12px;

    text-align:left;

    font-size:10px;

    letter-spacing:.08em;

    color:#879b9e;

    background:
        rgba(243,249,248,.90);

    position:sticky;

    top:0;

    z-index:2;
}


td{
    padding:
        14px 12px;

    border-top:
        1px solid #e7eeee;

    font-size:12px;

    color:#49666a;
}


tbody tr{
    transition:
        background .18s;
}


tbody tr:hover{
    background:
        rgba(228,246,244,.60);
}


.price{
    color:#278b87;

    font-weight:700;
}


/* =========================================================
   Badge
========================================================= */

.badge{
    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        6px 9px;

    border-radius:999px;

    font-size:10px;

    font-weight:600;
}


.badge::before{
    content:"";

    width:6px;
    height:6px;

    border-radius:50%;
}


.badge-ok{
    color:#288765;

    background:#e5f8ef;
}


.badge-ok::before{
    background:#3eaf81;
}


.badge-warning{
    color:#aa7a25;

    background:#fff4dc;
}


.badge-warning::before{
    background:#e4ae4f;
}


.badge-expired{
    color:#b65b5b;

    background:#fdeaea;
}


.badge-expired::before{
    background:#d97676;
}


.badge-deleted{
    color:#89999b;

    background:#edf1f1;
}


.badge-deleted::before{
    background:#96a4a5;
}


/* =========================================================
   Small Buttons
========================================================= */

.actions{
    display:flex;

    gap:5px;

    flex-wrap:wrap;
}


.small{
    padding:
        6px 9px;

    border-radius:8px;

    border:
        1px solid #dce7e6;

    background:
        rgba(255,255,255,.75);

    color:#597477;

    cursor:pointer;

    font-size:10px;
}


.small:hover{
    background:#fff;
}


.small.edit{
    color:#278f89;
}


.small.danger{
    color:#bd6868;
}


/* =========================================================
   Modal
========================================================= */

.modal-mask{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(24,57,61,.42);

    backdrop-filter:
        blur(13px);
}


.modal-mask.show{
    display:flex;
}


.modal{
    width:
        min(
            720px,
            100%
        );

    padding:23px;

    border-radius:26px;

    background:
        rgba(255,255,255,.94);

    border:
        1px solid white;

    box-shadow:
        0 35px 90px
        rgba(35,80,84,.28);
}


.modal-head{
    display:flex;

    justify-content:
        space-between;

    align-items:center;

    margin-bottom:18px;
}


.modal-head h3{
    margin:0;

    color:#25494d;
}


.close{
    width:37px;
    height:37px;

    border:none;

    border-radius:11px;

    background:#edf4f3;

    color:#456568;

    cursor:pointer;
}


.modal-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}


.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:8px;

    margin-top:19px;
}


/* =========================================================
   Toast
========================================================= */

.toast-box{
    position:fixed;

    top:20px;
    right:20px;

    z-index:300;

    display:flex;

    flex-direction:column;

    gap:8px;
}


.toast{
    width:
        min(
            350px,
            calc(100vw - 40px)
        );

    padding:
        14px 16px;

    border-radius:15px;

    color:#24464a;

    background:
        rgba(255,255,255,.93);

    border:
        1px solid white;

    box-shadow:
        0 18px 45px
        rgba(38,82,85,.19);

    backdrop-filter:blur(20px);

    font-size:12px;

    animation:
        toastIn .25s ease;
}


.toast.success{
    border-left:
        4px solid #49b98f;
}


.toast.error{
    border-left:
        4px solid #e27979;
}


@keyframes toastIn{

    from{
        opacity:0;

        transform:
            translateX(20px);
    }

    to{
        opacity:1;

        transform:
            translateX(0);
    }

}


/* =========================================================
   Footer
========================================================= */

.footer{
    margin-top:20px;

    text-align:center;

    font-size:10px;

    color:#9cadad;

    letter-spacing:.13em;
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}


@media(max-width:720px){

    .hero{
        height:410px;
    }

    .hero-content{
        padding-top:55px;
    }

    .hero-title{
        font-size:58px;
    }

    .sun{
        width:100px;
        height:100px;

        right:7%;
        left:auto;
    }

    .palm-left{
        width:180px;
        height:285px;
    }

    .palm-right{
        width:150px;
        height:245px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;

        align-items:flex-start;
    }

    .toolbar-right{
        width:100%;
    }

    .search-wrap{
        width:100%;
    }

    .search-input{
        width:100%;
    }

}


@media(max-width:480px){

    .hero-title{
        font-size:48px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .modal-grid{
        grid-template-columns:1fr;
    }

    .panel{
        padding:16px;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     海岛 HERO
======================================================= -->

<section class="hero">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>


    <!-- 海水 -->

    <div class="ocean">

<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
"https://dufemmclialublrxzwny.supabase.co";


const SUPABASE_KEY =
"sb_publishable_G1lGo2yiVKzQeNFiJdG6Dg_HCdWFEFU";


const {
    createClient
} = window.supabase;


const sb =
createClient(
    SUPABASE_URL,

    {
        db:{
            schema:"public"
        }
    }
);



/* =========================================================
   DOM
========================================================= */

const $ =
s =>
document.querySelector(s);


const sellDate =
$("#sellDate");

const expireDate =
$("#expireDate");

const price =
$("#price");

const buyerEmail =
$("#buyerEmail");

const projectNo =
$("#projectNo");

const operator =
$("#operator");


const tableBody =
$("#tableBody");

const searchInput =
$("#searchInput");

const dbStatus =
$("#dbStatus");

const toastBox =
$("#toastBox");


let allRows = [];

let editingId = null;


/* =========================================================
   工具
========================================================= */

function safe(v){

    return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function money(v){

    return new Intl.NumberFormat(
        "zh-CN",
        {
            style:"currency",
            currency:"CNY",
            minimumFractionDigits:2
        }
    ).format(
        Number(v || 0)
    );

}


function toast(
    text,
    type="success"
){

    const el =
    document.createElement("div");

    el.className =
    `toast ${type}`;

    el.textContent =
    text;

    toastBox.appendChild(el);


    setTimeout(
        ()=>{
            el.style.opacity="0";
            el.style.transform="translateX(20px)";
        },
        2600
    );


    setTimeout(
        ()=>{
            el.remove();
        },
        3000
    );

}


function daysLeft(v){

    if(!v)
        return null;


    const today =
    new Date();

    today.setHours(0,0,0,0);


    const target =
    new Date(
        v+"T00:00:00"
    );


    return Math.ceil(
        (target-today)
        /
        86400000
    );

}


function statusOf(row){

    if(
        row.is_deleted
        ===
        "已删除"
    ){

        return {
            text:"已删除",
            cls:"badge-deleted"
        };

    }


    const d =
    daysLeft(
        row.expire_date
    );


    if(
        d !== null
        &&
        d < 0
    ){

        return {
            text:"已过期",
            cls:"badge-expired"
        };

    }


    if(
        d !== null
        &&
        d <= 7
    ){

        return {
            text:
            d === 0
            ?
            "今天到期"
            :
            `${d}天后到期`,

            cls:"badge-warning"
        };

    }


    return {
        text:"正常",
        cls:"badge-ok"
    };

}



/* =========================================================
   加载
========================================================= */

async function loadData(
    show=false
){

    dbStatus.textContent =
    "正在同步 Supabase…";


    const {
        data,
        error
    } =
    await sb

    .from("sales_list")

    .select("*")

    .order(
        "expire_date",
        {
            ascending:true
        }
    );


    if(error){

        dbStatus.textContent =
        "数据库连接失败";

        toast(
            error.message,
            "error"
        );

        return;

    }


    allRows =
    data || [];


    dbStatus.textContent =
    `数据库已连接 · ${allRows.length} 条记录`;


    updateStats();

    filterRows();


    if(show){

        toast(
            "数据已刷新"
        );

    }

}



/* =========================================================
   Stats
========================================================= */

function updateStats(){

    const total =
    allRows.reduce(
        (sum,row)=>
        sum + Number(row.price || 0),
        0
    );


    const deleted =
    allRows.filter(
        r =>
        r.is_deleted === "已删除"
    ).length;


    $("#totalAmount").textContent =
    money(total);

    $("#totalCount").textContent =
    allRows.length;

    $("#activeCount").textContent =
    allRows.length - deleted;

    $("#deletedCount").textContent =
    deleted;

}



/* =========================================================
   表格
========================================================= */

function render(rows){

    tableBody.innerHTML="";


    rows.forEach(
        (row,index)=>{

            const status =
            statusOf(row);


            const tr =
            document.createElement("tr");


            if(
                row.is_deleted === "已删除"
            ){

                tr.style.opacity=".48";

            }


            tr.innerHTML=`

            <td>
                ${index+1}
            </td>

            <td>
                ${safe(row.sell_date || "-")}
            </td>

            <td>
                ${safe(row.expire_date || "-")}
            </td>

            <td class="price">
                ${safe(money(row.price))}
            </td>

            <td>
                ${safe(row.buyer_email || "-")}
            </td>

            <td>
                ${safe(row.project_no || "-")}
            </td>

            <td>

                <span
                    class="badge ${status.cls}"
                >
                    ${safe(status.text)}
                </span>

            </td>

            <td>
                ${safe(row.operator || "-")}
            </td>

            <td>

                <div class="actions">

                    <button
                        class="small edit"
                        data-action="edit"
                        data-id="${row.id}"
                    >
                        编辑
                    </button>

                    <button
                        class="small"
                        data-action="toggle"
                        data-id="${row.id}"
                    >

                        ${
                        row.is_deleted==="已删除"
                        ?
                        "恢复"
                        :
                        "标记删除"
                        }

                    </button>

                    <button
                        class="small danger"
                        data-action="delete"
                        data-id="${row.id}"
                    >
                        永久删除
                    </button>

                </div>

            </td>

            `;


            tableBody.appendChild(tr);

        }
    );

}



/* =========================================================
   搜索
========================================================= */

function filterRows(){

    const q =
    searchInput
    .value
    .trim()
    .toLowerCase();


    if(!q){

        render(allRows);

        return;

    }


    render(
        allRows.filter(
            r =>
            [
                r.sell_date,
                r.expire_date,
                r.price,
                r.buyer_email,
                r.project_no,
                r.operator,
                r.is_deleted
            ]
            .join(" ")
            .toLowerCase()
            .includes(q)
        )
    );

}


searchInput.addEventListener(
    "input",
    filterRows
);



/* =========================================================
   新增
========================================================= */

$("#btnAdd").onclick =
async function(){

    const payload={

        sell_date:
        sellDate.value,

        expire_date:
        expireDate.value,

        price:
        Number(price.value || 0),

        buyer_email:
        buyerEmail.value.trim(),

        project_no:
        projectNo.value.trim(),

        operator:
        operator.value,

        is_deleted:
        "未删除"

    };


    const {
        error
    } =
    await sb

    .from("sales_list")

    .insert([payload]);


    if(error){

        toast(
            "新增失败："+error.message,
            "error"
        );

        return;

    }


    clearForm();

    toast(
        "新增成功 🌴"
    );

    await loadData();

};



/* =========================================================
   清空
========================================================= */

function clearForm(){

    sellDate.value="";

    expireDate.value="";

    price.value="";

    buyerEmail.value="";

    projectNo.value="";

    operator.value="曾安南";

}


$("#btnClear").onclick =
clearForm;



/* =========================================================
   表格操作
========================================================= */

tableBody.onclick =
async function(e){

    const btn =
    e.target.closest(
        "[data-action]"
    );


    if(!btn)
        return;


    const id =
    Number(
        btn.dataset.id
    );


    const action =
    btn.dataset.action;


    if(action==="edit"){

        openEdit(id);

    }


    if(action==="toggle"){

        await toggleDeleted(id);

    }


    if(action==="delete"){

        await removeRow(id);

    }

};



/* =========================================================
   标记删除
========================================================= */

async function toggleDeleted(id){

    const row =
    allRows.find(
        r =>
        Number(r.id) === id
    );


    if(!row)
        return;


    const next =
    row.is_deleted === "已删除"
    ?
    "未删除"
    :
    "已删除";


    const {
        error
    } =
    await sb

    .from("sales_list")

    .update({
        is_deleted:next
    })

    .eq("id",id);


    if(error){

        toast(
            error.message,
            "error"
        );

        return;

    }


    toast(
        next === "已删除"
        ?
        "已标记删除"
        :
        "记录已恢复"
    );


    await loadData();

}



/* =========================================================
   永久删除
========================================================= */

async function removeRow(id){

    if(
        !confirm(
            "确定永久删除？\n此操作无法恢复。"
        )
    )
        return;


    const {
        error
    } =
    await sb

    .from("sales_list")

    .delete()

    .eq("id",id);


    if(error){

        toast(
            error.message,
            "error"
        );

        return;

    }


    toast(
        "记录已永久删除"
    );


    await loadData();

}



/* =========================================================
   编辑
========================================================= */

function openEdit(id){

    const row =
    allRows.find(
        r =>
        Number(r.id) === id
    );


    if(!row)
        return;


    editingId=id;


    $("#editSellDate").value =
    row.sell_date || "";

    $("#editExpireDate").value =
    row.expire_date || "";

    $("#editPrice").value =
    row.price ?? "";

    $("#editBuyerEmail").value =
    row.buyer_email || "";

    $("#editProjectNo").value =
    row.project_no || "";

    $("#editOperator").value =
    row.operator || "曾安南";


    $("#editModal")
    .classList
    .add("show");

}


function closeEdit(){

    $("#editModal")
    .classList
    .remove("show");

    editingId=null;

}


$("#closeModal").onclick =
closeEdit;


$("#cancelEdit").onclick =

   保存编辑
========================================================= */

$("#saveEdit").onclick =
async function(){

    if(
        editingId === null
    )
        return;


    const updates={

        sell_date:
        $("#editSellDate").value,

        expire_date:
        $("#editExpireDate").value,

        price:
        Number(
            $("#editPrice").value || 0
        ),

        buyer_email:
        $("#editBuyerEmail")
        .value
        .trim(),

        project_no:
        $("#editProjectNo")
        .value
        .trim(),

        operator:
        $("#editOperator").value

    };


    const {
        error
    } =
    await sb

    .from("sales_list")

    .update(updates)

    .eq(
        "id",
        editingId
    );


    if(error){

        toast(
            error.message,
            "error"
        );

        return;

    }


    closeEdit();

    toast(
        "修改已保存"

    await loadData();

};



/* =========================================================
   刷新
========================================================= */

$("#btnRefresh").onclick =

/* =========================================================
   CSV
========================================================= */

$("#btnExport").onclick =
function(){

    if(!allRows.length){

        toast(
            "当前没有数据",
            "error"
        );

        return;

    }


    const header=[
        "序号",
        "售卖日期",
        "截止日期",
        "售价",
        "买家邮箱",
        "项目号",
        "是否已删除",
        "操作人"
    ];


    let csv =
    "\uFEFF"
    +
    header.join(",")
    +
    "\n";


    allRows.forEach(
        (r,i)=>{

            const values=[
                i+1,
                r.sell_date || "",
                r.expire_date || "",
                r.price || 0,
                r.buyer_email || "",
                r.project_no || "",
                r.is_deleted || "",
                r.operator || ""
            ];


            csv +=
            values
            .map(
                v =>
                `"${String(v)
                .replaceAll(
                    '"',
                    '""'
                )}"`
            )
            .join(",")
            +
            "\n";

        }
    );


    const blob =
    new Blob(
        [csv],
        {
            type:
            "text/csv;charset=utf-8"
        }
    );


    const url =
    URL.createObjectURL(blob);


    const a =
    document.createElement("a");


    a.href=url;

    a.download=
    "挣钱上三亚_销售数据.csv";


    a.click();


    URL.revokeObjectURL(url);


    toast(
        "CSV 已导出"
    );

};

========================================================= */

$("#year").textContent =
new Date().getFullYear();


window.addEventListener(
    "load",
    loadData
);

</script>
