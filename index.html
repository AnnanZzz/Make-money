<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b2b">

<title>挣钱上三亚 · Sanya Sales Dashboard</title>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   01. 基础变量
========================================================= */

:root {
    --bg-deep: #061923;
    --bg-ocean: #0b4f67;
    --bg-ocean-2: #0b7891;

    --glass: rgba(255,255,255,.14);
    --glass-strong: rgba(255,255,255,.20);
    --glass-border: rgba(255,255,255,.25);

    --text-main: #f8fdff;
    --text-soft: rgba(240,252,255,.74);
    --text-dark: #0f2833;

    --cyan: #4de8e0;
    --blue: #4eafff;
    --green: #70e6b2;
    --orange: #ffc56e;
    --red: #ff7f89;
    --purple: #a99cff;

    --shadow:
        0 24px 80px rgba(0,0,0,.22);

    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 11px;

    --transition:
        .28s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   02. Reset
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;

    color: var(--text-main);

    font-family:
        Inter,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #072535 0%,
            #0a5970 38%,
            #10879c 72%,
            #70c8ce 100%
        );

    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================================================
   03. 动态海景背景
========================================================= */

.ocean-scene {
    position: fixed;
    inset: 0;
    z-index: -20;
    overflow: hidden;
    pointer-events: none;
}


/* 天空光晕 */

.sun-glow {
    position: absolute;

    width: 650px;
    height: 650px;

    right: -130px;
    top: -180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,248,190,.42) 0%,
            rgba(255,225,130,.13) 30%,
            transparent 67%
        );

    filter: blur(5px);

    animation:
        sunPulse 8s ease-in-out infinite alternate;
}

@keyframes sunPulse {
    from {
        transform: scale(.94);
        opacity: .78;
    }

    to {
        transform: scale(1.08);
        opacity: 1;
    }
}


/* 海面高光 */

.sea-light {
    position: absolute;

    width: 120vw;
    height: 55vh;

    left: -10vw;
    top: 40vh;

    background:
        radial-gradient(
            ellipse at center,
            rgba(190,251,255,.25),
            transparent 58%
        );

    filter: blur(35px);

    animation:
        seaGlow 10s ease-in-out infinite alternate;
}

@keyframes seaGlow {
    from {
        transform: translateX(-3%) scaleX(.96);
    }

    to {
        transform: translateX(3%) scaleX(1.04);
    }
}


/* 水面细纹 */

.ripple {
    position: absolute;
    inset: 42% -20% auto -20%;

    height: 45%;

    opacity: .32;

    background:
        repeating-radial-gradient(
            ellipse at 50% 0%,
            transparent 0 16px,
            rgba(255,255,255,.14) 17px 18px,
            transparent 19px 34px
        );

    transform:
        perspective(800px)
        rotateX(64deg);

    animation:
        rippleMove 13s linear infinite;
}

@keyframes rippleMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 120px 55px;
    }
}


/* 光点 */

.sparkles {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.42) 0 1px,
            transparent 1.5px
        );

    background-size: 42px 42px;

    opacity: .16;

    animation:
        sparkleDrift 18s linear infinite;
}

@keyframes sparkleDrift {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-42px);
    }
}


/* =========================================================
   04. 动态波浪
========================================================= */

.wave {
    position: absolute;

    left: -25%;
    bottom: -90px;

    width: 150%;
    height: 310px;

    border-radius: 46% 54% 0 0;

    transform-origin: center bottom;
}

.wave-1 {
    bottom: -90px;

    background:
        rgba(228,255,255,.25);

    animation:
        waveOne 9s ease-in-out infinite alternate;
}

.wave-2 {
    bottom: -125px;

    background:
        rgba(14,106,130,.46);

    animation:
        waveTwo 12s ease-in-out infinite alternate;
}

.wave-3 {
    bottom: -165px;

    background:
        rgba(4,48,67,.58);

    animation:
        waveThree 16s ease-in-out infinite alternate;
}

@keyframes waveOne {
    from {
        transform:
            translateX(-3%)
            rotate(-1deg)
            scaleY(.92);
    }

    to {
        transform:
            translateX(4%)
            rotate(1deg)
            scaleY(1.08);
    }
}

@keyframes waveTwo {
    from {
        transform:
            translateX(5%)
            rotate(1.2deg);
    }

    to {
        transform:
            translateX(-4%)
            rotate(-1.2deg);
    }
}

@keyframes waveThree {
    from {
        transform:
            translateX(-2%)
            scaleX(.98);
    }

    to {
        transform:
            translateX(3%)
            scaleX(1.04);
    }
}


/* =========================================================
   05. 椰子树 SVG
========================================================= */

.palm {
    position: absolute;

    bottom: 55px;

    width: 250px;
    height: 360px;

    opacity: .48;

    filter:
        drop-shadow(
            0 18px 35px rgba(0,0,0,.22)
        );

    transform-origin: bottom center;
}

.palm svg {
    width: 100%;
    height: 100%;
}

.palm-left {
    left: -45px;

    animation:
        palmLeft 6s ease-in-out infinite alternate;
}

.palm-right {
    right: -55px;

    transform: scaleX(-1);

    animation:
        palmRight 7s ease-in-out infinite alternate;
}

@keyframes palmLeft {
    from {
        transform:
            rotate(-2deg);
    }

    to {
        transform:
            rotate(2.6deg);
    }
}

@keyframes palmRight {
    from {
        transform:
            scaleX(-1)
            rotate(-2.5deg);
    }

    to {
        transform:
            scaleX(-1)
            rotate(2deg);
    }
}


/* =========================================================
   06. 页面主体
========================================================= */

.app {
    width: min(1460px, calc(100% - 36px));

    margin: 0 auto;

    padding:
        32px 0
        80px;

    position: relative;
    z-index: 10;
}


/* =========================================================
   07. 顶部 Hero
========================================================= */

.hero {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 24px;

    margin-bottom: 25px;

    animation:
        fadeUp .75s ease both;
}

.hero-brand {
    min-width: 0;
}

.eyebrow {
    display: inline-flex;

    align-items: center;
    gap: 8px;

    padding:
        7px 11px;

    border-radius: 999px;

    border:
        1px solid rgba(255,255,255,.22);

    background:
        rgba(255,255,255,.10);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    font-size: 12px;
    letter-spacing: .14em;

    color:
        rgba(255,255,255,.78);

    margin-bottom: 12px;
}

.eyebrow-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #76ffe0;

    box-shadow:
        0 0 14px #76ffe0;
}

.hero h1 {
    margin: 0;

    font-size:
        clamp(
            34px,
            5vw,
            65px
        );

    line-height: .98;

    letter-spacing: -.05em;

    text-shadow:
        0 8px 26px rgba(0,0,0,.14);
}

.hero-subtitle {
    margin:
        13px 0 0;

    font-size:
        clamp(
            13px,
            1.3vw,
            16px
        );

    color: var(--text-soft);

    letter-spacing: .04em;
}

.hero-actions {
    display: flex;
    gap: 10px;
}


/* =========================================================
   08. 通用玻璃效果
========================================================= */

.glass {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.19),
            rgba(255,255,255,.09)
        );

    border:
        1px solid
        rgba(255,255,255,.24);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(26px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(26px)
        saturate(145%);
}


/* =========================================================
   09. 顶部按钮
========================================================= */

.icon-button {
    width: 45px;
    height: 45px;

    display: grid;
    place-items: center;

    border: 1px solid
        rgba(255,255,255,.23);

    border-radius: 15px;

    background:
        rgba(255,255,255,.12);

    color: #fff;

    font-size: 18px;

    cursor: pointer;

    backdrop-filter:
        blur(18px);

    transition: var(--transition);
}

.icon-button:hover {
    transform:
        translateY(-3px)
        scale(1.03);

    background:
        rgba(255,255,255,.19);
}


/* =========================================================
   10. 统计卡片
========================================================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;

    margin-bottom: 18px;
}

.stat-card {
    position: relative;

    overflow: hidden;

    min-height: 143px;

    padding: 20px;

    border-radius:
        var(--radius-lg);

    transition:
        var(--transition);

    animation:
        fadeUp .7s ease both;
}

.stat-card:nth-child(2) {
    animation-delay: .06s;
}

.stat-card:nth-child(3) {
    animation-delay: .12s;
}

.stat-card:nth-child(4) {
    animation-delay: .18s;
}

.stat-card:hover {
    transform:
        translateY(-6px);

    border-color:
        rgba(255,255,255,.38);
}

.stat-card::after {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    right: -40px;
    bottom: -50px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18),
            transparent 68%
        );
}

.stat-label {
    font-size: 12px;

    color:
        rgba(255,255,255,.68);

    letter-spacing: .09em;
}

.stat-value {
    margin-top: 11px;

    font-size:
        clamp(
            25px,
            3vw,
            37px
        );

    font-weight: 700;

    letter-spacing:
        -.04em;

    white-space: nowrap;
}

.stat-caption {
    margin-top: 9px;

    font-size: 12px;

    color:
        rgba(255,255,255,.55);
}


/* =========================================================
   11. 主面板
========================================================= */

.main-panel {
    padding: 21px;

    border-radius:
        var(--radius-xl);

    animation:
        fadeUp .8s .14s ease both;
}

.panel-header {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 18px;
}

.panel-title {
    display: flex;

    align-items: center;

    gap: 11px;
}

.panel-title-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            rgba(77,232,224,.32),
            rgba(78,175,255,.25)
        );

    border:
        1px solid
        rgba(255,255,255,.21);
}

.panel-title h2 {
    margin: 0;

    font-size: 18px;
}

.panel-title p {
    margin:
        3px 0 0;

    color: var(--text-soft);

    font-size: 12px;
}


/* =========================================================
   12. 表单
========================================================= */

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(6, minmax(135px,1fr));

    gap: 12px;
}

.field {
    display: flex;

    flex-direction: column;

    gap: 7px;
}

.field label {
    font-size: 12px;

    color:
        rgba(255,255,255,.72);

    padding-left: 3px;
}

.input,
.select {
    width: 100%;

    min-height: 46px;

    padding:
        0 13px;

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius: 13px;

    outline: none;

    background:
        rgba(4,35,49,.20);

    color: #fff;

    font-size: 14px;

    transition: var(--transition);

    backdrop-filter:
        blur(15px);
}

.input::placeholder {
    color:
        rgba(255,255,255,.38);
}

.input:focus,
.select:focus {
    border-color:
        rgba(89,239,229,.68);

    box-shadow:
        0 0 0 4px
        rgba(77,232,224,.09);

    background:
        rgba(6,49,65,.27);
}

.select option {
    color: #172b34;

    background: #fff;
}

.form-actions {
    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 16px;
}


/* =========================================================
   13. 按钮
========================================================= */

.btn {
    border: 0;

    min-height: 43px;

    padding:
        0 16px;

    border-radius: 13px;

    display:
        inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    cursor: pointer;

    font-weight: 600;

    font-size: 13px;

    transition: var(--transition);

    white-space: nowrap;
}

.btn:disabled {
    opacity: .52;

    cursor: wait;
}

.btn-primary {
    color: #04333b;

    background:
        linear-gradient(
            135deg,
            #8dffe4,
            #68d8ff
        );

    box-shadow:
        0 12px 30px
        rgba(82,225,228,.18);
}

.btn-primary:hover {
    transform:
        translateY(-3px);

    box-shadow:
        0 18px 36px
        rgba(82,225,228,.28);
}

.btn-secondary {
    color: #fff;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.18);
}

.btn-secondary:hover {
    background:
        rgba(255,255,255,.18);

    transform:
        translateY(-2px);
}

.btn-danger {
    color: #fff;

    background:
        rgba(255,102,114,.20);

    border:
        1px solid
        rgba(255,130,139,.30);
}

.btn-danger:hover {
    background:
        rgba(255,94,106,.30);
}


/* =========================================================
   14. 数据区域
========================================================= */

.data-panel {
    margin-top: 18px;

    padding: 19px;

    border-radius:
        var(--radius-xl);

    animation:
        fadeUp .85s .22s ease both;
}

.data-toolbar {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 14px;

    margin-bottom: 15px;
}

.data-toolbar-left h3 {
    margin: 0;

    font-size: 17px;
}

.data-toolbar-left p {
    margin:
        4px 0 0;

    color: var(--text-soft);

    font-size: 12px;
}

.toolbar-controls {
    display: flex;

    gap: 9px;

    flex-wrap: wrap;
}

.search-wrap {
    position: relative;
}

.search-input {
    width: 235px;

    min-height: 41px;

    padding:
        0 14px 0 38px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 13px;

    background:
        rgba(3,30,43,.18);

    color: #fff;

    outline: none;
}

.search-input::placeholder {
    color:
        rgba(255,255,255,.40);
}

.search-icon {
    position: absolute;

    left: 13px;
    top: 50%;

    transform:
        translateY(-50%);

    opacity: .55;
}


/* =========================================================
   15. Table
========================================================= */

.table-shell {
    overflow-x: auto;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(5,34,46,.13);
}

table {
    width: 100%;

    min-width: 1110px;

    border-collapse: collapse;
}

thead th {
    position: sticky;

    top: 0;

    z-index: 2;

    padding:
        13px 12px;

    text-align: left;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: .06em;

    color:
        rgba(255,255,255,.63);

    background:
        rgba(4,36,49,.44);

    backdrop-filter:
        blur(20px);
}

tbody td {
    padding:
        14px 12px;

    border-top:
        1px solid
        rgba(255,255,255,.085);

    font-size: 13px;

    vertical-align: middle;
}

tbody tr {
    transition:
        background .2s ease,
        transform .2s ease;
}

tbody tr:hover {
    background:
        rgba(255,255,255,.07);
}

.money {
    font-weight: 700;

    color: #a8ffdf;
}


/* =========================================================
   16. 状态徽章
========================================================= */

.badge {
    display:
        inline-flex;

    align-items: center;

    gap: 6px;

    padding:
        6px 9px;

    border-radius: 999px;

    font-size: 11px;

    font-weight: 600;

    border:
        1px solid transparent;
}

.badge::before {
    content: "";

    width: 6px;
    height: 6px;

    border-radius: 50%;
}

.badge-normal {
    color: #baffdf;

    background:
        rgba(76,215,149,.13);

    border-color:
        rgba(117,231,176,.24);
}

.badge-normal::before {
    background: #6df2b2;

    box-shadow:
        0 0 10px #6df2b2;
}

.badge-warning {
    color: #ffe0a6;

    background:
        rgba(255,181,78,.13);

    border-color:
        rgba(255,201,119,.24);
}

.badge-warning::before {
    background: #ffc66d;
}

.badge-expired {
    color: #ffbbc1;

    background:
        rgba(255,92,108,.14);

    border-color:
        rgba(255,128,140,.26);
}

.badge-expired::before {
    background: #ff7a89;
}

.badge-deleted {
    color:
        rgba(255,255,255,.58);

    background:
        rgba(255,255,255,.08);

    border-color:
        rgba(255,255,255,.12);
}

.badge-deleted::before {
    background:
        rgba(255,255,255,.48);
}


/* =========================================================
   17. 行操作按钮
========================================================= */

.row-actions {
    display: flex;

    gap: 6px;

    flex-wrap: wrap;
}

.mini-btn {
    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 9px;

    padding:
        6px 9px;

    font-size: 11px;

    cursor: pointer;

    color: #fff;

    background:
        rgba(255,255,255,.08);

    transition: var(--transition);
}

.mini-btn:hover {
    transform:
        translateY(-2px);

    background:
        rgba(255,255,255,.15);
}

.mini-edit {
    color: #bcf7ff;
}

.mini-toggle {
    color: #baffda;
}

.mini-delete {
    color: #ffb7bd;
}


/* =========================================================
   18. 空状态
========================================================= */

.empty-state {
    padding:
        60px 20px;

    text-align: center;

    color:
        rgba(255,255,255,.55);
}

.empty-icon {
    font-size: 34px;

    margin-bottom: 10px;
}


/* =========================================================
   19. Modal
========================================================= */

.modal-backdrop {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 18px;

    background:
        rgba(1,15,22,.62);

    backdrop-filter:
        blur(12px);

    animation:
        fadeIn .22s ease;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width:
        min(
            720px,
            100%
        );

    max-height:
        calc(100vh - 36px);

    overflow-y: auto;

    border-radius: 25px;

    padding: 23px;

    background:
        linear-gradient(
            145deg,
            rgba(10,61,76,.92),
            rgba(5,35,48,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.20);

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.40);

    animation:
        modalIn .28s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;

        transform:
            translateY(18px)
            scale(.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

.modal-header {
    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 18px;
}

.modal-header h3 {
    margin: 0;
}

.close-btn {
    width: 36px;
    height: 36px;

    border: 0;

    border-radius: 10px;

    background:
        rgba(255,255,255,.09);

    color: #fff;

    cursor: pointer;
}

.modal-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 13px;
}

.modal-actions {
    display: flex;

    justify-content:
        flex-end;

    gap: 9px;

    margin-top: 20px;
}


/* =========================================================
   20. Toast
========================================================= */

.toast-stack {
    position: fixed;

    right: 22px;
    top: 22px;

    z-index: 500;

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.toast {
    width:
        min(
            360px,
            calc(100vw - 44px)
        );

<script>
/* =========================================================
   01. Supabase 配置
========================================================= */

const SUPABASE_URL =
    "https://dufemmclialublrxzwny.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_G1lGo2yiVKzQeNFiJdG6Dg_HCdWFEFU";


const { createClient } =
    window.supabase;


const sb =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            db: {
                schema: "public"
            }
        }
    );


/* =========================================================
   02. DOM
========================================================= */

const $ =
    selector =>
        document.querySelector(selector);


const tableBody =
    $("#tableBody");

const emptyState =
    $("#emptyState");

const searchInput =
    $("#searchInput");

const databaseStatus =
    $("#databaseStatus");

const toastStack =
    $("#toastStack");


const sellDateEl =
    $("#sellDate");

const expireDateEl =
    $("#expireDate");

const priceEl =
    $("#price");

const buyerEmailEl =
    $("#buyerEmail");

const projectNoEl =
    $("#projectNo");

const operatorEl =
    $("#operator");


const btnAdd =
    $("#btnAdd");

const btnClear =
    $("#btnClear");

const btnRefresh =
    $("#btnRefresh");

const refreshTopBtn =
    $("#refreshTopBtn");

const btnExport =
    $("#btnExport");

const themeBtn =
    $("#themeBtn");


/* =========================================================
   03. 状态
========================================================= */

let allRows = [];

let editingId = null;


/* =========================================================
   04. 工具函数
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function money(value) {

    return new Intl.NumberFormat(
        "zh-CN",
        {
            style: "currency",
            currency: "CNY",
            minimumFractionDigits: 2
        }
    ).format(
        Number(value || 0)
    );

}


function toast(
    message,
    type = "info"
) {

    const item =
        document.createElement("div");

    item.className =
        `toast ${type}`;

    item.textContent =
        message;

    toastStack.appendChild(item);


    setTimeout(
        () => {

            item.style.opacity = "0";

            item.style.transform =
                "translateX(20px)";

        },
        2800
    );


    setTimeout(
        () => {

            item.remove();

        },
        3250
    );

}


function setLoading(
    button,
    loading,
    text
) {

    if (loading) {

        button.disabled = true;

        button.dataset.original =
            button.innerHTML;

        button.innerHTML =
            `
            <span class="loader"></span>
            ${text}
            `;

    }

    else {

        button.disabled = false;

        if (
            button.dataset.original
        ) {

            button.innerHTML =
                button.dataset.original;

        }

    }

}


function daysUntil(dateString) {

    if (!dateString)
        return null;


    const today =
        new Date();

    today.setHours(
        0,0,0,0
    );


    const target =
        new Date(
            dateString + "T00:00:00"
        );


    return Math.ceil(
        (
            target.getTime()
            -
            today.getTime()
        )
        /
        86400000
    );

}


/* =========================================================
   05. 判断状态
========================================================= */

function getStatus(row) {

    if (
        row.is_deleted === "已删除"
    ) {

        return {
            text: "已删除",
            className:
                "badge-deleted"
        };

    }


    const diff =
        daysUntil(
            row.expire_date
        );


    if (
        diff !== null
        &&
        diff < 0
    ) {

        return {
            text: "已过期",
            className:
                "badge-expired"
        };

    }


    if (
        diff !== null
        &&
        diff <= 7
    ) {

        return {
            text:
                diff === 0
                    ? "今天到期"
                    : `${diff}天后到期`,

            className:
                "badge-warning"
        };

    }


    return {
        text: "正常",
        className:
            "badge-normal"
    };

}


/* =========================================================
   06. 加载数据
========================================================= */

async function loadData(
    showToast = false
) {

    databaseStatus.textContent =
        "正在同步 Supabase 数据库…";


    const {
        data,
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .select("*")

        .order(
            "expire_date",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "读取失败：",
            error
        );


        databaseStatus.textContent =
            "数据库连接失败";


        toast(
            "数据库读取失败：" +
            error.message,
            "error"
        );


        return;

    }


    allRows =
        data || [];


    databaseStatus.textContent =
        `数据库已连接 · ${allRows.length} 条记录`;


    renderStats();

    filterAndRender();


    if (showToast) {

        toast(
            "数据已刷新",
            "success"
        );

    }

}


/* =========================================================
   07. 统计
========================================================= */

function renderStats() {

    const totalAmount =
        allRows.reduce(
            (
                sum,
                row
            ) =>
                sum
                +
                Number(
                    row.price || 0
                ),
            0
        );


    const deleted =
        allRows.filter(
            row =>
                row.is_deleted
                ===
                "已删除"
        ).length;


    const active =
        allRows.length
        -
        deleted;


    $("#totalAmount")
        .textContent =
        money(totalAmount);


    $("#totalCount")
        .textContent =
        allRows.length;


    $("#activeCount")
        .textContent =
        active;


    $("#deletedCount")
        .textContent =
        deleted;

}


/* =========================================================
   08. 搜索
========================================================= */

function filterAndRender() {

    const keyword =
        searchInput
            .value
            .trim()
            .toLowerCase();


    if (!keyword) {

        renderTable(
            allRows
        );

        return;

    }


    const filtered =
        allRows.filter(
            row => {

                const combined =
                    [
                        row.sell_date,
                        row.expire_date,
                        row.price,
                        row.buyer_email,
                        row.project_no,
                        row.operator,
                        row.is_deleted
                    ]

                    .join(" ")

                    .toLowerCase();


                return combined.includes(
                    keyword
                );

            }
        );


    renderTable(
        filtered
    );

}


/* =========================================================
   09. 渲染 Table
========================================================= */

function renderTable(rows) {

    tableBody.innerHTML = "";


    if (!rows.length) {

        emptyState.style.display =
            "block";

        return;

    }


    emptyState.style.display =
        "none";


    rows.forEach(
        (
            row,
            index
        ) => {


            const status =
                getStatus(row);


            const tr =
                document.createElement(
                    "tr"
                );


            if (
                row.is_deleted
                ===
                "已删除"
            ) {

                tr.style.opacity =
                    ".55";

            }


            tr.innerHTML =
                `

                <td>
                    ${index + 1}
                </td>


                <td>
                    ${escapeHtml(
                        row.sell_date || "-"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        row.expire_date || "-"
                    )}
                </td>


                <td class="money">

                    ${escapeHtml(
                        money(
                            row.price
                        )
                    )}

                </td>


                <td>
                    ${escapeHtml(
                        row.buyer_email || "-"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        row.project_no || "-"
                    )}
                </td>


                <td>

                    <span
                        class="
                        badge
                        ${status.className}
                        "
                    >

                        ${escapeHtml(
                            status.text
                        )}

                    </span>

                </td>


                <td>
                    ${escapeHtml(
                        row.operator || "-"
                    )}
                </td>


                <td>

                    <div class="row-actions">


                        <button
                            class="
                            mini-btn
                            mini-edit
                            "
                            onclick="
                            openEdit(
                                ${Number(row.id)}
                            )
                            "
                        >
                            编辑
                        </button>


                        <button
                            class="
                            mini-btn
                            mini-toggle
                            "
                            onclick="
                            toggleDelete(
                                ${Number(row.id)},
                                '${escapeHtml(
                                    row.is_deleted
                                    ||
                                    "未删除"
                                )}'
                            )
                            "
                        >

                            ${
                                row.is_deleted
                                ===
                                "已删除"

                                ?
                                "恢复"

                                :
                                "标记删除"
                            }

                        </button>


                        <button
                            class="
                            mini-btn
                            mini-delete
                            "
                            onclick="
                            permanentDelete(
                                ${Number(row.id)}
                            )
                            "
                        >
                            永久删除
                        </button>


                    </div>

                </td>

                `;


            tableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   10. 新增
========================================================= */

btnAdd.addEventListener(
    "click",
    async () => {


        const payload =
        {

            sell_date:
                sellDateEl.value,

            expire_date:
                expireDateEl.value,

            price:
                Number(
                    priceEl.value
                    ||
                    0
                ),

            buyer_email:
                buyerEmailEl
                    .value
                    .trim(),

            project_no:
                projectNoEl
                    .value
                    .trim(),

            operator:
                operatorEl.value,

            is_deleted:
                "未删除"

        };


        if (
            !payload.sell_date
            &&
            !payload.expire_date
            &&
            !payload.buyer_email
            &&
            !payload.project_no
        ) {

            toast(
                "请先填写销售记录",
                "error"
            );

            return;

        }


        setLoading(
            btnAdd,
            true,
            "保存中"
        );


        const {
            error
        } =
            await sb

            .from(
                "sales_list"
            )

            .insert([
                payload
            ]);


        setLoading(
            btnAdd,
            false
        );


        if (error) {

            console.error(
                error
            );


            toast(
                "新增失败：" +
                error.message,
                "error"
            );


            return;

        }


        clearForm();


        toast(
            "销售记录新增成功",
            "success"
        );


        await loadData();

    }
);


/* =========================================================
   11. 清空
========================================================= */

function clearForm() {

    sellDateEl.value = "";

    expireDateEl.value = "";

    priceEl.value = "";

    buyerEmailEl.value = "";

    projectNoEl.value = "";

    operatorEl.value =
        "曾安南";

}


btnClear.addEventListener(
    "click",
    clearForm
);


/* =========================================================
   12. 删除状态
========================================================= */

window.toggleDelete =
async function(
    id,
    current
) {

    const newStatus =
        current === "已删除"
        ?
        "未删除"
        :
        "已删除";


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .update({
            is_deleted:
                newStatus
        })

        .eq(
            "id",
            id
        );


    if (error) {

        toast(
            "状态更新失败：" +
            error.message,
            "error"
        );

        return;

    }


    toast(
        newStatus ===
        "已删除"

        ?
        "已标记为删除"

        :
        "记录已恢复",

        "success"
    );


    await loadData();

};


/* =========================================================
   13. 永久删除
========================================================= */

window.permanentDelete =
async function(id) {

    const ok =
        confirm(
            "确定永久删除这条记录吗？\n\n此操作不可恢复。"
        );


    if (!ok)
        return;


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        toast(
            "删除失败：" +
            error.message,
            "error"
        );

        return;

    }


    toast(
        "记录已永久删除",
        "success"
    );


    await loadData();

};


/* =========================================================
   14. 编辑
========================================================= */

window.openEdit =
function(id) {

    const row =
        allRows.find(
            item =>
                Number(item.id)
                ===
                Number(id)
        );


    if (!row)
        return;


    editingId =
        Number(id);


    $("#editSellDate").value =
        row.sell_date || "";

    $("#editExpireDate").value =
        row.expire_date || "";

    $("#editPrice").value =
        row.price ?? "";

    $("#editBuyerEmail").value =
        row.buyer_email || "";

    $("#editProjectNo").value =
        row.project_no || "";

    $("#editOperator").value =
        row.operator || "曾安南";


    $("#editModal")
        .classList
        .add("show");

};


/* =========================================================
   15. 关闭编辑
========================================================= */

function closeEdit() {

    editingId = null;


    $("#editModal")
        .classList
        .remove("show");

}


$("#closeEditModal")
    .addEventListener(
        "click",
        closeEdit
    );


$("#cancelEdit")
    .addEventListener(
        "click",
        closeEdit
    );


$("#editModal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id
                ===
                "editModal"
            ) {

                closeEdit();

            }

        }
    );


/* =========================================================
   16. 保存编辑
========================================================= */

$("#saveEdit")
    .addEventListener(
        "click",
        async () => {


            if (
                editingId === null
            )
                return;


            const button =
                $("#saveEdit");


            setLoading(
                button,
                true,
                "保存中"
            );


            const updates =
            {

                sell_date:
                    $("#editSellDate")
                        .value,

                expire_date:
                    $("#editExpireDate")
                        .value,

                price:
                    Number(
                        $("#editPrice")
                            .value
                        ||
                        0
                    ),

                buyer_email:
                    $("#editBuyerEmail")
                        .value
                        .trim(),

                project_no:
                    $("#editProjectNo")
                        .value
                        .trim(),

                operator:
                    $("#editOperator")
                        .value

            };


            const {
                error
            } =
                await sb

                .from(
                    "sales_list"
                )

                .update(
                    updates
                )

                .eq(
                    "id",
                    editingId
                );


            setLoading(
                button,
                false
            );


            if (error) {

                toast(
                    "保存失败：" +
                    error.message,
                    "error"
                );

                return;

            }


            closeEdit();


            toast(
                "修改已保存",
                "success"
            );


            await loadData();

        }
    );


/* =========================================================
   17. 刷新
========================================================= */

btnRefresh.addEventListener(
    "click",
    () =>
        loadData(true)
);


refreshTopBtn.addEventListener(
    "click",
    () =>
        loadData(true)
);


/* =========================================================
   18. 搜索
========================================================= */

searchInput.addEventListener(
    "input",
    filterAndRender
);


/* =========================================================
   19. CSV
========================================================= */

btnExport.addEventListener(
    "click",
    () => {


        if (!allRows.length) {

            toast(
                "当前没有可导出的数据",
                "error"
            );

            return;

        }


        const headers =
        [
            "序号",
            "售卖日期",
            "截止日期",
            "售价",
            "买家邮箱",
            "项目号",
            "是否已删除",
            "操作人"
        ];


        let csv =
            "\uFEFF"
            +
            headers.join(",")
            +
            "\n";


        allRows.forEach(
            (
                row,
                index
            ) => {


                const values =
                [
                    index + 1,
                    row.sell_date || "",
                    row.expire_date || "",
                    row.price || 0,
                    row.buyer_email || "",
                    row.project_no || "",
                    row.is_deleted || "",
                    row.operator || ""
                ];


                csv +=
                    values

                    .map(
                        value =>
                            `"${String(value)
                                .replaceAll(
                                    '"',
                                    '""'
                                )}"`
                    )

                    .join(",")

                    +
                    "\n";

            }
        );


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const anchor =
            document.createElement(
                "a"
            );


        anchor.href =
            url;


        anchor.download =
            "挣钱上三亚_销售数据.csv";


        document.body
            .appendChild(
                anchor
            );


        anchor.click();


        anchor.remove();


        URL.revokeObjectURL(
            url
        );


        toast(
            "CSV 导出完成",
            "success"
        );

    }
);


/* =========================================================
   20. 夜间模式
========================================================= */

themeBtn.addEventListener(
    "click",
    () => {


        document.body
            .classList
            .toggle(
                "night"
            );


        const isNight =
            document.body
                .classList
                .contains(
                    "night"
                );


        themeBtn.textContent =
            isNight
            ?
            "☀"
            :
            "☾";


        localStorage.setItem(
            "sanyaTheme",
            isNight
            ?
            "night"
            :
            "day"
        );

    }
);


/* =========================================================
   21. 初始化主题
========================================================= */

function initTheme() {

    const saved =
        localStorage.getItem(
            "sanyaTheme"
        );


    if (
        saved === "night"
    ) {

        document.body
            .classList
            .add(
                "night"
            );


        themeBtn.textContent =
            "☀";

    }

}


/* =========================================================
   22. Footer
========================================================= */

$("#footerYear")
    .textContent =
    new Date()
        .getFullYear();


/* =========================================================
   23. ESC 关闭弹窗
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeEdit();

        }

    }
);


/* =========================================================
   24. 页面启动
========================================================= */

window.addEventListener(
    "load",
    async () => {

        initTheme();

        await loadData();

    }
);

</script>
