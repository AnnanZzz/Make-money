<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挣钱上三亚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{
    margin:0;
    min-height:100vh;
    background:
        linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center center no-repeat;
    background-size:cover;
    background-attachment:fixed;
}
.container{max-width:1100px;margin:20px auto;padding:16px}
.form-box{background:#ffffffdd;padding:20px;border-radius:10px;margin-bottom:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.item{display:flex;flex-direction:column;gap:4px}
input{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:9px 16px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
.btn-del{background:#dc2626}
.btn-export{background:#059669}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#ffffffdd}
th,td{border:1px solid #ddd;padding:10px;text-align:left;font-size:14px}
th{background:#e2e8f0}
.expire{background:#ffdddd !important}
.sum-row td{background:#fef3c7;font-weight:bold;font-size:15px;color:#dc2626}
.tip-bar{background:#dbeafe;padding:10px;border-radius:8px;margin-bottom:16px;font-size:14px}
h2{color:#0f766e;margin-top:0}
</style>
</head>
<body>
<div class="container">
<h2>挣钱上三亚</h2>
<div class="tip-bar">难兄难弟→发家致富</div>
<div class="form-box">
    <div class="row">
        <div class="item">
            <label>售卖日期</label>
            <input type="date" id="sellDate">
        </div>
        <div class="item">
            <label>截止日期</label>
            <input type="date" id="expireDate">
        </div>
        <div class="item">
            <label>售卖价格</label>
            <input type="number" id="price" placeholder="元">
        </div>
        <div class="item">
            <label>买家邮箱</label>
            <input type="email" id="buyerEmail" placeholder="买家邮箱">
        </div>
    </div>
    <div class="row">
        <button onclick="addRecord()">新增记录</button>
        <button class="btn-export" onclick="exportExcel()">导出备份(CSV)</button>
    </div>
</div>

<table>
<thead>
<tr>
<th style="width:60px">序号</th>
<th>售卖日期</th>
<th>截止日期</th>
<th>售价(元)</th>
<th>状态</th>
<th>买家邮箱</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
<tfoot>
<tr class="sum-row">
<td colspan="3" style="text-align:right">合计（共<span id="countText">0</span>条）</td>
<td colspan="4">¥ <span id="sumText">0.00</span></td>
</tr>
</tfoot>
</table>
</div>

<script>
const SUPABASE_URL = "https://fhbqgieahzkdonknkotg.supabase.co";
const SUPABASE_ANON_KEY = "fhbqgieahzkdonknkotg";
const { createClient } = supabase;
const sbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let list = [];
const tableBody = document.getElementById('tableBody');
const countText = document.getElementById('countText');
const sumText = document.getElementById('sumText');

function subscribeDB(){
    sbClient.channel('table-db')
    .on('postgres_changes',{event:'*',schema:'public',table:'records'},()=>{loadData()})
    .subscribe();
}

async function loadData(){
    const {data,error}=await sbClient.from('records').select('*').order('id',{asc:true});
    if(error){console.error(error);return;}
    list=data||[];
    render();
}

function render(){
    tableBody.innerHTML='';
    const now=new Date();
    now.setHours(0,0,0,0);
    let total=0;
    list.forEach((item,idx)=>{
        total += Number(item.price||0);
        const expDate=new Date(item.expireDate);
        expDate.setHours(0,0,0,0);
        const isOver=expDate < now;
        const tr=document.createElement('tr');
        if(isOver) tr.className='expire';
        tr.innerHTML=`
            <td>${idx+1}</td>
            <td>${item.sellDate||''}</td>
            <td>${item.expireDate||''}</td>
            <td>${item.price||0}</td>
            <td>${isOver?'⚠️已过期':'✅正常'}</td>
            <td>${item.buyerEmail||''}</td>
            <td><button class="btn-del" onclick="del(${item.id})">删除</button></td>
        `;
        tableBody.appendChild(tr);
    })
    countText.innerText=list.length;
    sumText.innerText=total.toFixed(2);
}

async function addRecord(){
    const sellDate=document.getElementById('sellDate').value.trim();
    const expireDate=document.getElementById('expireDate').value.trim();
    const price=document.getElementById('price').value;
    const buyerEmail=document.getElementById('buyerEmail').value.trim();
    if(!sellDate||!expireDate){alert('请填写售卖日期与截止日期');return;}
    await sbClient.from('records').insert([{sellDate,expireDate,price:Number(price),buyerEmail}]);
    document.getElementById('sellDate').value='';
    document.getElementById('expireDate').value='';
    document.getElementById('price').value='';
    document.getElementById('buyerEmail').value='';
}

async function del(id){
    if(!confirm('确定删除这条记录吗？'))return;
    await sbClient.from('records').delete().eq('id',id);
}

function exportExcel(){
    if(list.length===0){alert('暂无数据');return;}
    let csv="序号,售卖日期,截止日期,售价,状态,买家邮箱\n";
    const now=new Date();now.setHours(0,0,0,0);
    list.forEach((item,idx)=>{
        const expDate=new Date(item.expireDate);
        expDate.setHours(0,0,0,0);
        const st=expDate<now?"已过期":"正常";
        csv += `${idx+1},${item.sellDate},${item.expireDate},${item.price},${st},"${item.buyerEmail||''}"\n`;
    })
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="挣钱上三亚统计表.csv";
    a.click();
}

(async ()=>{
    await loadData();
    subscribeDB();
})();
</script>
</body>
</html>
