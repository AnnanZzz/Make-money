<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挣钱上三亚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{
    margin:0;
    min-height:100vh;
    background:#f4f7fa;
}
.container{max-width:1200px;margin:20px auto;padding:16px}
.form-box{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 1px 4px #00000015}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.item{display:flex;flex-direction:column;gap:4px}
input,select{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;min-width:140px}
button{padding:9px 16px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
button:hover{background:#1d4ed8}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px #00000015}
th,td{border:1px solid #e5e7eb;padding:9px 10px;font-size:13px}
th{background:#eff6ff}
.total-bar{padding:12px;background:#dbeafe;border-radius:8px;margin:10px 0;font-weight:bold}
</style>
</head>
<body>
<div class="container">
    <h2>挣钱上三亚</h2>
    <div class="form-box">
        <div class="row">
            <div class="item">
                <label>售卖日期</label>
                <input type="date" id="sellDate">
            </div>
            <div class="item">
                <label>截止日期</label>
                <input type="date" id="expireDate">
            </div>
            <div class="item">
                <label>售卖价格(元)</label>
                <input type="number" id="price" placeholder="输入金额">
            </div>
            <div class="item">
                <label>买家邮箱</label>
                <input type="text" id="buyerEmail" placeholder="买家邮箱">
            </div>
            <div class="item">
                <label>项目号</label>
                <input type="text" id="projectNo" placeholder="项目编号">
            </div>
            <div class="item">
                <label>是否已删除</label>
                <select id="isDeleted">
                    <option value="未删除">未删除</option>
                    <option value="已删除">已删除</option>
                </select>
            </div>
            <div class="item">
                <label>操作人</label>
                <select id="operator">
                    <option value="崔囤月">崔囤月</option>
                    <option value="刘俊屹">刘俊屹</option>
                    <option value="曾安南">曾安南</option>
                </select>
            </div>
        </div>
        <div class="row">
            <button id="btnAdd">新增记录</button>
            <button id="btnExport">导出备份(CSV)</button>
        </div>
    </div>

    <div class="total-bar" id="totalBar">合计（共0条） ¥0.00</div>
    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>售卖日期</th>
                <th>截止日期</th>
                <th>售价(元)</th>
                <th>买家邮箱</th>
                <th>项目号</th>
                <th>是否已删除</th>
                <th>操作人</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
// ==========这里填你的Supabase信息============
const SUPABASE_URL = "https://fhbqgieahzkdonknkotg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0hgg6udla0_K8P-1pIliCg_pXElMix-";
// ==========================================

const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tableBody = document.getElementById('tableBody');
const totalBar = document.getElementById('totalBar');

// dom元素
const sellDateEl = document.getElementById('sellDate');
const expireDateEl = document.getElementById('expireDate');
const priceEl = document.getElementById('price');
const buyerEmailEl = document.getElementById('buyerEmail');
const projectNoEl = document.getElementById('projectNo');
const isDeletedEl = document.getElementById('isDeleted');
const operatorEl = document.getElementById('operator');
const btnAdd = document.getElementById('btnAdd');
const btnExport = document.getElementById('btnExport');

// 加载数据，按截止日期升序排序
async function loadData(){
    console.log("开始读取数据");
    const {data,error} = await supabase
        .from('records')
        .select('*')
        .order('expireDate', {ascending:true}); //截止日期升序，快到期排上面

    if(error){
        console.error("读取错误",error);
        return;
    }
    renderTable(data);
}

//渲染表格
function renderTable(list){
    tableBody.innerHTML = "";
    let sum = 0;
    list.forEach((row,idx)=>{
        sum += Number(row.price||0);
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${idx+1}</td>
            <td>${row.sellDate||''}</td>
            <td>${row.expireDate||''}</td>
            <td>${row.price||0}</td>
            <td>${row.buyerEmail||''}</td>
            <td>${row.project_no||''}</td>
            <td>${row.is_deleted||"未删除"}</td>
            <td>${row.operator||''}</td>
            <td>
                <button data-id="${row.id}" class="delBtn">删除</button>
            </td>
        `;
        tableBody.appendChild(tr);
    })
    totalBar.innerText = `合计（共${list.length}条） ¥${sum.toFixed(2)}`;

    //绑定删除
    document.querySelectorAll('.delBtn').forEach(btn=>{
        btn.onclick = async function(){
            const id = this.dataset.id;
            await supabase.from('records').delete().eq('id',id);
            loadData();
        }
    })
}

//新增记录
btnAdd.onclick = async function(){
    console.log("点击新增，进入函数");
    const payload = {
        sellDate: sellDateEl.value,
        expireDate: expireDateEl.value,
        price: Number(priceEl.value||0),
        buyerEmail: buyerEmailEl.value.trim(),
        project_no: projectNoEl.value.trim(),
        is_deleted: isDeletedEl.value,
        operator: operatorEl.value
    }
    const {error} = await supabase.from('records').insert([payload]);
    if(error){
        console.error("新增错误",error);
        alert("新增失败:"+JSON.stringify(error));
        return;
    }
    //清空表单
    sellDateEl.value = "";
    expireDateEl.value = "";
    priceEl.value = "";
    buyerEmailEl.value = "";
    projectNoEl.value = "";
    isDeletedEl.value = "未删除";
    operatorEl.value = "曾安南";
    loadData();
}

//导出CSV
btnExport.onclick = function(){
    const headers = ["序号","售卖日期","截止日期","售价(元)","买家邮箱","项目号","是否已删除","操作人"];
    let csvContent = headers.join(",") + "\n";
    const rows = Array.from(tableBody.querySelectorAll('tr'));
    rows.forEach(tr=>{
        const tds = Array.from(tr.querySelectorAll('td')).map(td=>'"'+td.innerText+'"');
        csvContent += tds.join(",") + "\n";
    })
    const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "挣钱上三亚_导出.csv";
    a.click();
}

window.onload = function(){
    console.log("页面初始化");
    loadData();
}
</script>
</body>
</html>
