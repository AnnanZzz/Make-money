<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071418">

<title>挣钱上三亚 · Sanya Sales</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   基础
========================================================= */

:root{
    --bg:#071418;
    --bg2:#0b2024;

    --card:rgba(11,30,34,.54);
    --card-strong:rgba(10,26,30,.78);
    --line:rgba(255,255,255,.10);

    --text:#f7f4ec;
    --muted:rgba(247,244,236,.62);

    --sand:#e7d4ad;
    --sand-2:#f1e6ce;

    --aqua:#78d7cf;
    --green:#8ad7ad;
    --amber:#efc982;
    --red:#ee9797;

    --shadow:0 24px 70px rgba(0,0,0,.28);

    --r1:28px;
    --r2:20px;
    --r3:14px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    min-height:100vh;

    background:
        linear-gradient(
            180deg,
            #061216 0%,
            #092328 46%,
            #0a3338 100%
        );

    color:var(--text);

    font-family:
        Inter,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        -apple-system,
        sans-serif;

    overflow-x:hidden;
}


/* =========================================================
   动态背景
========================================================= */

#oceanCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:-10;
}

.scene-overlay{
    position:fixed;
    inset:0;

    z-index:-9;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(2,10,13,.18),
            rgba(3,18,22,.08) 40%,
            rgba(3,15,18,.35)
        );
}


/* 太阳 */

.sun{
    position:fixed;

    width:440px;
    height:440px;

    right:-80px;
    top:-130px;

    z-index:-8;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(252,226,170,.27) 0%,
            rgba(236,193,118,.11) 38%,
            transparent 70%
        );

    filter:blur(8px);

    animation:sunBreath 8s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes sunBreath{
    from{
        transform:scale(.92);
        opacity:.76;
    }

    to{
        transform:scale(1.08);
        opacity:1;
    }
}


/* 海面光带 */

.reflection{
    position:fixed;

    left:50%;
    bottom:-15vh;

    width:70vw;
    height:80vh;

    z-index:-8;

    transform:
        translateX(-50%)
        perspective(500px)
        rotateX(68deg);

    background:
        radial-gradient(
            ellipse,
            rgba(231,212,173,.20),
            rgba(231,212,173,.06) 36%,
            transparent 67%
        );

    filter:blur(14px);

    animation:reflectionMove 7s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes reflectionMove{
    from{
        transform:
            translateX(-53%)
            perspective(500px)
            rotateX(68deg)
            scaleX(.90);
    }

    to{
        transform:
            translateX(-47%)
            perspective(500px)
            rotateX(68deg)
            scaleX(1.08);
    }
}


/* =========================================================
   椰树
========================================================= */

.palm{
    position:fixed;

    bottom:-45px;

    width:310px;
    height:470px;

    z-index:-6;

    opacity:.32;

    filter:
        drop-shadow(
            0 30px 60px rgba(0,0,0,.35)
        );

    transform-origin:bottom center;

    pointer-events:none;
}

.palm-left{
    left:-65px;

    animation:
        palmSwingLeft
        6s
        ease-in-out
        infinite
        alternate;
}

.palm-right{
    right:-80px;

    transform:scaleX(-1);

    animation:
        palmSwingRight
        7.5s
        ease-in-out
        infinite
        alternate;
}

@keyframes palmSwingLeft{
    from{
        transform:rotate(-1.7deg);
    }

    to{
        transform:rotate(2.2deg);
    }
}

@keyframes palmSwingRight{
    from{
        transform:
            scaleX(-1)
            rotate(-1.4deg);
    }

    to{
        transform:
            scaleX(-1)
            rotate(2deg);
    }
}

.palm path{
    fill:#031013;
}


/* =========================================================
   主体
========================================================= */

.app{
    width:min(
        1450px,
        calc(100% - 38px)
    );

    margin:auto;

    padding:
        34px 0
        80px;

    position:relative;
    z-index:5;
}


/* =========================================================
   Hero
========================================================= */

.hero{
    display:flex;

    justify-content:space-between;
    align-items:flex-end;

    gap:24px;

    margin-bottom:26px;
}

.hero-left{
    max-width:760px;
}

.kicker{
    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:13px;

    font-size:11px;

    letter-spacing:.20em;

    color:
        rgba(247,244,236,.55);
}

.kicker-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--aqua);

    box-shadow:
        0 0 16px
        rgba(120,215,207,.8);
}

h1{
    margin:0;

    font-size:
        clamp(
            44px,
            7vw,
            88px
        );

    line-height:.9;

    letter-spacing:-.06em;

    font-weight:650;
}

.hero-sub{
    margin:
        16px 0 0;

    color:var(--muted);

    font-size:14px;

    letter-spacing:.04em;
}

.hero-actions{
    display:flex;

    gap:10px;
}


/* =========================================================
   通用玻璃
========================================================= */

.glass{
    background:
        linear-gradient(
            145deg,
            rgba(11,30,34,.66),
            rgba(8,25,29,.36)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:var(--shadow);

    backdrop-filter:
        blur(28px)
        saturate(120%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(120%);
}


/* =========================================================
   按钮
========================================================= */

.icon-btn{
    width:46px;
    height:46px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.055);

    color:var(--text);

    font-size:18px;

    cursor:pointer;

    transition:.25s ease;

    backdrop-filter:blur(16px);
}

.icon-btn:hover{
    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.10);
}

.btn{
    border:none;

    min-height:44px;

    padding:
        0 17px;

    border-radius:13px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

    font-size:13px;

    font-weight:600;

    transition:.25s ease;
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            var(--sand-2),
            var(--sand)
        );

    color:#1a2827;

    box-shadow:
        0 12px 30px
        rgba(231,212,173,.12);
}

.btn-primary:hover{
    transform:
        translateY(-3px);

    box-shadow:
        0 18px 36px
        rgba(231,212,173,.22);
}

.btn-secondary{
    color:var(--text);

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.10);
}

.btn-secondary:hover{
    background:
        rgba(255,255,255,.10);

    transform:
        translateY(-2px);
}

.btn:disabled{
    opacity:.50;
    cursor:wait;
}


/* =========================================================
   统计卡片
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        1.6fr
        1fr
        1fr
        1fr;

    gap:13px;

    margin-bottom:17px;
}

.stat{
    min-height:150px;

    padding:21px;

    border-radius:var(--r2);

    position:relative;

    overflow:hidden;

    transition:.28s ease;
}

.stat:hover{
    transform:
        translateY(-5px);

    border-color:
        rgba(231,212,173,.20);
}

.stat::after{
    content:"";

    position:absolute;

    width:140px;
    height:140px;

    right:-55px;
    bottom:-65px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(231,212,173,.11),
            transparent 70%
        );
}

.stat-label{
    color:
        rgba(247,244,236,.48);

    font-size:10px;

    letter-spacing:.16em;
}

.stat-value{
    margin-top:15px;

    font-size:
        clamp(
            26px,
            3.5vw,
            46px
        );

    font-weight:630;

    letter-spacing:-.04em;
}

.stat-main .stat-value{
    color:var(--sand-2);
}

.stat-caption{
    margin-top:8px;

    color:var(--muted);

    font-size:12px;
}


/* =========================================================
   面板
========================================================= */

.panel{
    padding:22px;

    border-radius:var(--r1);

    margin-bottom:17px;
}

.panel-head{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:16px;

    margin-bottom:19px;
}

.panel-title{
    display:flex;

    gap:12px;

    align-items:center;
}

.panel-icon{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        rgba(231,212,173,.10);

    border:
        1px solid
        rgba(231,212,173,.15);

    color:var(--sand);
}

.panel-title h2,
.panel-title h3{
    margin:0;

    font-size:17px;

    font-weight:620;
}

.panel-title p{
    margin:
        4px 0 0;

    font-size:11px;

    color:var(--muted);
}


/* =========================================================
   表单
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(
            6,
            minmax(140px,1fr)
        );

    gap:11px;
}

.field{
    display:flex;

    flex-direction:column;

    gap:7px;
}

.field label{
    padding-left:3px;

    font-size:11px;

    color:
        rgba(247,244,236,.57);
}

.input,
.select{
    width:100%;

    min-height:47px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.095);

    background:
        rgba(0,0,0,.13);

    padding:
        0 13px;

    outline:none;

    color:var(--text);

    font-size:13px;

    transition:.22s ease;
}

.input::placeholder{
    color:
        rgba(247,244,236,.28);
}

.input:focus,
.select:focus{
    border-color:
        rgba(231,212,173,.42);

    box-shadow:
        0 0 0 4px
        rgba(231,212,173,.06);
}

.select option{
    background:#102225;
    color:#fff;
}

.form-actions{
    display:flex;

    gap:9px;

    margin-top:16px;
}


/* =========================================================
   工具栏
========================================================= */

.toolbar{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:14px;

    margin-bottom:15px;
}

.toolbar-left h3{
    margin:0;
    font-size:17px;
}

.toolbar-left p{
    margin:
        4px 0 0;

    font-size:11px;

    color:var(--muted);
}

.toolbar-right{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.search-box{
    position:relative;
}

.search-box span{
    position:absolute;

    left:13px;
    top:50%;

    transform:
        translateY(-50%);

    opacity:.38;
}

.search-input{
    width:250px;

    height:42px;

    padding:
        0 13px 0 38px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(0,0,0,.12);

    color:#fff;

    outline:none;
}

.search-input::placeholder{
    color:
        rgba(255,255,255,.28);
}


/* =========================================================
   Table
========================================================= */

.table-wrap{
    overflow:auto;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.075);
}

table{
    width:100%;

    min-width:1100px;

    border-collapse:collapse;
}

th{
    padding:
        13px 12px;

    text-align:left;

    font-size:10px;

    letter-spacing:.10em;

    font-weight:600;

    color:
        rgba(247,244,236,.44);

    background:
        rgba(4,18,21,.42);

    position:sticky;

    top:0;

    z-index:2;

    backdrop-filter:blur(14px);
}

td{
    padding:
        14px 12px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    font-size:12px;

    color:
        rgba(247,244,236,.84);
}

tbody tr{
    transition:.20s ease;
}

tbody tr:hover{
    background:
        rgba(255,255,255,.035);
}

.price{
    color:var(--sand-2);

    font-weight:650;
}


/* =========================================================
   状态
========================================================= */

.badge{
    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        6px 9px;

    border-radius:999px;

    font-size:10px;

    border:
        1px solid transparent;
}

.badge::before{
    content:"";

    width:6px;
    height:6px;

    border-radius:50%;
}

.badge-ok{
    color:#b7ebce;

    background:
        rgba(83,169,122,.09);

    border-color:
        rgba(112,198,151,.14);
}

.badge-ok::before{
    background:#79d3a0;
}

.badge-warning{
    color:#f0d79f;

    background:
        rgba(199,160,80,.09);

    border-color:
        rgba(231,201,130,.15);
}

.badge-warning::before{
    background:#e7c373;
}

.badge-expired{
    color:#eeb0b0;

    background:
        rgba(189,89,89,.10);

    border-color:
        rgba(224,126,126,.15);
}

.badge-expired::before{
    background:#e28a8a;
}

.badge-deleted{
    color:
        rgba(247,244,236,.38);

    background:
        rgba(255,255,255,.035);

    border-color:
        rgba(255,255,255,.07);
}

.badge-deleted::before{
    background:
        rgba(255,255,255,.30);
}


/* =========================================================
   小按钮
========================================================= */

.row-actions{
    display:flex;

    flex-wrap:wrap;

    gap:5px;
}

.small-btn{
    padding:
        6px 8px;

    border-radius:8px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.70);

    cursor:pointer;

    font-size:10px;

    transition:.2s ease;
}

.small-btn:hover{
    background:
        rgba(255,255,255,.09);

    color:#fff;
}

.small-btn.edit{
    color:#b2e3dc;
}

.small-btn.delete{
    color:#e7a6a6;
}


/* =========================================================
   空状态
========================================================= */

.empty{
    display:none;

    text-align:center;

    padding:
        65px 20px;

    color:var(--muted);
}

.empty-icon{
    font-size:28px;

    margin-bottom:10px;
}


/* =========================================================
   Modal
========================================================= */

.modal-mask{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        rgba(1,8,10,.68);

    backdrop-filter:blur(13px);
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:
        min(
            700px,
            100%
        );

    max-height:
        calc(100vh - 40px);

    overflow:auto;

    padding:22px;

    border-radius:26px;

    background:
        rgba(8,27,31,.94);

    border:
        1px solid
        rgba(255,255,255,.11);

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.46);

    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;

        transform:
            translateY(14px)
            scale(.98);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.modal-top{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.modal-top h3{
    margin:0;

    font-size:17px;
}

.modal-close{
    width:36px;
    height:36px;

    border:none;

    border-radius:10px;

    background:
        rgba(255,255,255,.06);

    color:#fff;

    cursor:pointer;
}

.modal-grid{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:12px;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:8px;

    margin-top:19px;
}


/* =========================================================
   Toast
========================================================= */

.toast-box{
    position:fixed;

    right:20px;
    top:20px;

    z-index:200;

    display:flex;

    flex-direction:column;

    gap:8px;
}

.toast{
    width:
        min(
            350px,
            calc(100vw - 40px)
        );

    padding:
        13px 15px;

    border-radius:14px;

    background:
        rgba(5,22,25,.90);

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.35);

    backdrop-filter:blur(18px);

    font-size:12px;

    animation:
        toastIn .25s ease;
}

.toast.success{
    border-left:
        3px solid
        var(--green);
}

.toast.error{
    border-left:
        3px solid
        var(--red);
}

.toast.info{
    border-left:
        3px solid
        var(--aqua);
}

@keyframes toastIn{
    from{
        opacity:0;

        transform:
            translateX(18px);
    }

    to{
        opacity:1;

        transform:
            translateX(0);
    }
}


/* =========================================================
   Footer
========================================================= */

.footer{
    text-align:center;

    margin-top:20px;

    color:
        rgba(247,244,236,.28);

    font-size:10px;

    letter-spacing:.15em;
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }

    .form-grid{
        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );
    }

}


@media(max-width:720px){

    .app{
        width:
            calc(100% - 20px);

        padding-top:20px;
    }

    .hero{
        align-items:flex-start;
    }

    h1{
        font-size:47px;
    }

    .hero-sub{
        max-width:240px;
    }

    .palm{
        opacity:.16;

        width:220px;
        height:360px;
    }

    .form-grid{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }

    .toolbar{
        align-items:flex-start;

        flex-direction:column;
    }

    .toolbar-right{
        width:100%;
    }

    .search-box{
        width:100%;
    }

    .search-input{
        width:100%;
    }

}


@media(max-width:470px){

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .modal-grid{
        grid-template-columns:1fr;
    }

    .panel{
        padding:15px;

        border-radius:22px;
    }

    h1{
        font-size:41px;
    }

}
</style>
</head>

<body>

<script>
/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    "https://dufemmclialublrxzwny.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_G1lGo2yiVKzQeNFiJdG6Dg_HCdWFEFU";

const {
    createClient
} = window.supabase;

const sb =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            db:{
                schema:"public"
            }
        }
    );


/* =========================================================
   Canvas 动态海浪
========================================================= */

const canvas =
    document.getElementById(
        "oceanCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let W = 0;
let H = 0;
let DPR = 1;

let particles = [];


function resizeCanvas(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createParticles();

}


function createParticles(){

    const count =
        Math.min(
            70,
            Math.floor(
                W / 18
            )
        );

    particles =
        Array.from(
            {
                length:count
            },
            () => ({

                x:
                    Math.random() * W,

                y:
                    H * .42
                    +
                    Math.random()
                    *
                    H * .48,

                r:
                    Math.random()
                    * 1.4
                    + .3,

                speed:
                    Math.random()
                    * .18
                    + .04,

                phase:
                    Math.random()
                    *
                    Math.PI
                    *
                    2

            })
        );

}


function drawWave(
    t,
    baseY,
    amplitude,
    length,
    speed,
    alpha,
    color
){

    ctx.beginPath();

    ctx.moveTo(
        0,
        H
    );

    for(
        let x = 0;
        x <= W;
        x += 6
    ){

        const y =
            baseY

            +
            Math.sin(
                x / length
                +
                t * speed
            )
            *
            amplitude

            +
            Math.sin(
                x / (length * .55)
                -
                t * speed * .65
            )
            *
            amplitude
            *
            .28;

        ctx.lineTo(
            x,
            y
        );

    }

    ctx.lineTo(
        W,
        H
    );

    ctx.closePath();

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        color;

    ctx.fill();

    ctx.globalAlpha =
        1;

}


function drawFineLines(t){

    ctx.lineWidth =
        .65;

    for(
        let i = 0;
        i < 12;
        i++
    ){

        const yBase =
            H * .54
            +
            i
            *
            H * .035;

        ctx.beginPath();

        for(
            let x = 0;
            x <= W;
            x += 8
        ){

            const y =
                yBase

                +
                Math.sin(
                    x / (110 + i * 8)
                    +
                    t * (.45 + i * .014)
                )

                *
                (2 + i * .18);

            if(x === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }

        ctx.strokeStyle =
            `rgba(
                220,
                242,
                236,
                ${0.035 + i * .002}
            )`;

        ctx.stroke();

    }

}


function drawParticles(t){

    particles.forEach(
        p => {

            const twinkle =
                .35
                +
                Math.sin(
                    t * 1.3
                    +
                    p.phase
                )
                *
                .18;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `rgba(
                    238,
                    222,
                    190,
                    ${twinkle}
                )`;

            ctx.fill();

            p.x += p.speed;

            if(
                p.x >
                W + 10
            ){

                p.x = -10;

            }

        }
    );

}


function animateOcean(time){

    const t =
        time / 1000;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#061418"
    );

    sky.addColorStop(
        .46,
        "#0a2429"
    );

    sky.addColorStop(
        1,
        "#0b3439"
    );

    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const glow =
        ctx.createRadialGradient(
            W * .76,
            H * .24,
            10,
            W * .76,
            H * .24,
            Math.max(
                W,
                H
            )
            *
            .55
        );

    glow.addColorStop(
        0,
        "rgba(232,206,153,.13)"
    );

    glow.addColorStop(
        .45,
        "rgba(84,146,140,.05)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawWave(
        t,
        H * .52,
        13,
        120,
        .40,
        .34,
        "#19444a"
    );

    drawWave(
        t,
        H * .61,
        19,
        150,
        -.28,
        .30,
        "#0e353b"
    );

    drawWave(
        t,
        H * .72,
        25,
        190,
        .21,
        .28,
        "#08292e"
    );

    drawFineLines(t);

    drawParticles(t);

    requestAnimationFrame(
        animateOcean
    );

}


resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

requestAnimationFrame(
    animateOcean
);


/* =========================================================
   DOM
========================================================= */

const $ =
    selector =>
        document.querySelector(
            selector
        );


const sellDate =
    $("#sellDate");

const expireDate =
    $("#expireDate");

const price =
    $("#price");

const buyerEmail =
    $("#buyerEmail");

const projectNo =
    $("#projectNo");

const operator =
    $("#operator");


const btnAdd =
    $("#btnAdd");

const btnClear =
    $("#btnClear");

const btnRefresh =
    $("#btnRefresh");

const topRefresh =
    $("#topRefresh");

const btnExport =
    $("#btnExport");

const searchInput =
    $("#searchInput");


const tableBody =
    $("#tableBody");

const emptyState =
    $("#emptyState");

const dbStatus =
    $("#dbStatus");

const toastBox =
    $("#toastBox");


let allRows = [];

let editingId = null;


/* =========================================================
   工具
========================================================= */

function safe(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function money(value){

    return new Intl.NumberFormat(
        "zh-CN",
        {
            style:"currency",
            currency:"CNY",
            minimumFractionDigits:2
        }
    ).format(
        Number(
            value || 0
        )
    );

}


function notify(
    text,
    type = "info"
){

    const item =
        document.createElement(
            "div"
        );

    item.className =
        `toast ${type}`;

    item.textContent =
        text;

    toastBox.appendChild(
        item
    );

    setTimeout(
        () => {

            item.style.opacity =
                "0";

            item.style.transform =
                "translateX(15px)";

        },
        2700
    );

    setTimeout(
        () => {

            item.remove();

        },
        3100
    );

}


function daysLeft(date){

    if(!date)
        return null;

    const now =
        new Date();

    now.setHours(
        0,
        0,
        0,
        0
    );

    const target =
        new Date(
            date +
            "T00:00:00"
        );

    return Math.ceil(
        (
            target
            -
            now
        )
        /
        86400000
    );

}


function getStatus(row){

    if(
        row.is_deleted
        ===
        "已删除"
    ){

        return {
            label:"已删除",
            cls:"badge-deleted"
        };

    }

    const d =
        daysLeft(
            row.expire_date
        );

    if(
        d !== null
        &&
        d < 0
    ){

        return {
            label:"已过期",
            cls:"badge-expired"
        };

    }

    if(
        d !== null
        &&
        d <= 7
    ){

        return {
            label:
                d === 0
                ?
                "今天到期"
                :
                `${d} 天后到期`,

            cls:"badge-warning"
        };

    }

    return {
        label:"正常",
        cls:"badge-ok"
    };

}


/* =========================================================
   数据
========================================================= */

async function loadData(
    showTip = false
){

    dbStatus.textContent =
        "正在同步 Supabase…";

    const {
        data,
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .select("*")

        .order(
            "expire_date",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            error
        );

        dbStatus.textContent =
            "数据库连接失败";

        notify(
            "读取失败：" +
            error.message,
            "error"
        );

        return;

    }


    allRows =
        data || [];

    dbStatus.textContent =
        `已连接 · ${allRows.length} 条记录`;

    renderStats();

    filterRows();


    if(showTip){

        notify(
            "数据已同步",
            "success"
        );

    }

}


/* =========================================================
   Stats
========================================================= */

function renderStats(){

    const total =
        allRows.reduce(
            (
                sum,
                row
            ) =>
                sum
                +
                Number(
                    row.price || 0
                ),
            0
        );

    const deleted =
        allRows.filter(
            row =>
                row.is_deleted
                ===
                "已删除"
        ).length;

    $("#totalAmount")
        .textContent =
        money(total);

    $("#totalCount")
        .textContent =
        allRows.length;

    $("#activeCount")
        .textContent =
        allRows.length
        -
        deleted;

    $("#deletedCount")
        .textContent =
        deleted;

}


/* =========================================================
   Table
========================================================= */

function renderTable(rows){

    tableBody.innerHTML =
        "";

    if(!rows.length){

        emptyState.style.display =
            "block";

        return;

    }

    emptyState.style.display =
        "none";


    rows.forEach(
        (
            row,
            index
        ) => {

            const status =
                getStatus(row);

            const tr =
                document.createElement(
                    "tr"
                );

            if(
                row.is_deleted
                ===
                "已删除"
            ){

                tr.style.opacity =
                    ".48";

            }


            tr.innerHTML =
                `
                <td>
                    ${index + 1}
                </td>

                <td>
                    ${safe(
                        row.sell_date || "-"
                    )}
                </td>

                <td>
                    ${safe(
                        row.expire_date || "-"
                    )}
                </td>

                <td class="price">
                    ${safe(
                        money(
                            row.price
                        )
                    )}
                </td>

                <td>
                    ${safe(
                        row.buyer_email || "-"
                    )}
                </td>

                <td>
                    ${safe(
                        row.project_no || "-"
                    )}
                </td>

                <td>
                    <span
                        class="
                            badge
                            ${status.cls}
                        "
                    >
                        ${safe(
                            status.label
                        )}
                    </span>
                </td>

                <td>
                    ${safe(
                        row.operator || "-"
                    )}
                </td>

                <td>
                    <div class="row-actions">

                        <button
                            class="
                                small-btn
                                edit
                            "
                            data-action="edit"
                            data-id="${row.id}"
                        >
                            编辑
                        </button>

                        <button
                            class="small-btn"
                            data-action="toggle"
                            data-id="${row.id}"
                        >

                            ${
                                row.is_deleted
                                ===
                                "已删除"

                                ?
                                "恢复"

                                :
                                "标记删除"
                            }

                        </button>

                        <button
                            class="
                                small-btn
                                delete
                            "
                            data-action="delete"
                            data-id="${row.id}"
                        >
                            永久删除
                        </button>

                    </div>
                </td>
                `;

            tableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   搜索
========================================================= */

function filterRows(){

    const q =
        searchInput
            .value
            .trim()
            .toLowerCase();

    if(!q){

        renderTable(
            allRows
        );

        return;

    }

    const result =
        allRows.filter(
            row => {

                return [
                    row.sell_date,
                    row.expire_date,
                    row.price,
                    row.buyer_email,
                    row.project_no,
                    row.operator,
                    row.is_deleted
                ]
                .join(" ")
                .toLowerCase()
                .includes(q);

            }
        );

    renderTable(
        result
    );

}

searchInput.addEventListener(
    "input",
    filterRows
);


/* =========================================================
   新增
========================================================= */

btnAdd.addEventListener(
    "click",
    async () => {

        const payload = {

            sell_date:
                sellDate.value,

            expire_date:
                expireDate.value,

            price:
                Number(
                    price.value || 0
                ),

            buyer_email:
                buyerEmail
                    .value
                    .trim(),

            project_no:
                projectNo
                    .value
                    .trim(),

            operator:
                operator.value,

            is_deleted:
                "未删除"

        };


        if(
            !payload.sell_date
            &&
            !payload.expire_date
            &&
            !payload.buyer_email
            &&
            !payload.project_no
        ){

            notify(
                "请先填写记录内容",
                "error"
            );

            return;

        }


        btnAdd.disabled =
            true;

        btnAdd.textContent =
            "保存中…";


        const {
            error
        } =
            await sb

            .from(
                "sales_list"
            )

            .insert([
                payload
            ]);


        btnAdd.disabled =
            false;

        btnAdd.textContent =
            "＋ 新增记录";


        if(error){

            console.error(
                error
            );

            notify(
                "新增失败：" +
                error.message,
                "error"
            );

            return;

        }


        clearForm();

        notify(
            "新增成功",
            "success"
        );

        await loadData();

    }
);


/* =========================================================
   清空
========================================================= */

function clearForm(){

    sellDate.value = "";

    expireDate.value = "";

    price.value = "";

    buyerEmail.value = "";

    projectNo.value = "";

    operator.value =
        "曾安南";

}

btnClear.addEventListener(
    "click",
    clearForm
);


/* =========================================================
   Table 操作
========================================================= */

tableBody.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "button[data-action]"
            );

        if(!button)
            return;

        const id =
            Number(
                button.dataset.id
            );

        const action =
            button.dataset.action;


        if(
            action ===
            "edit"
        ){

            openEdit(id);

        }


        if(
            action ===
            "toggle"
        ){

            await toggleDelete(id);

        }


        if(
            action ===
            "delete"
        ){

            await permanentDelete(id);

        }

    }
);


/* =========================================================
   软删除
========================================================= */

async function toggleDelete(id){

    const row =
        allRows.find(
            r =>
                Number(r.id)
                ===
                Number(id)
        );

    if(!row)
        return;

    const next =
        row.is_deleted
        ===
        "已删除"
        ?
        "未删除"
        :
        "已删除";


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .update({
            is_deleted:next
        })

        .eq(
            "id",
            id
        );


    if(error){

        notify(
            "更新失败：" +
            error.message,
            "error"
        );

        return;

    }


    notify(
        next ===
        "已删除"
        ?
        "已标记删除"
        :
        "记录已恢复",
        "success"
    );

    await loadData();

}


/* =========================================================
   永久删除
========================================================= */

async function permanentDelete(id){

    const ok =
        confirm(
            "确定永久删除这条记录吗？\n\n此操作不可恢复。"
        );

    if(!ok)
        return;


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        notify(
            "删除失败：" +
            error.message,
            "error"
        );

        return;

    }


    notify(
        "记录已永久删除",
        "success"
    );

    await loadData();

}


/* =========================================================
   编辑 Modal
========================================================= */

function openEdit(id){

    const row =
        allRows.find(
            r =>
                Number(r.id)
                ===
                Number(id)
        );

    if(!row)
        return;


    editingId =
        id;


    $("#editSellDate").value =
        row.sell_date || "";

    $("#editExpireDate").value =
        row.expire_date || "";

    $("#editPrice").value =
        row.price ?? "";

    $("#editBuyerEmail").value =
        row.buyer_email || "";

    $("#editProjectNo").value =
        row.project_no || "";

    $("#editOperator").value =
        row.operator || "曾安南";


    $("#editModal")
        .classList
        .add(
            "show"
        );

}


function closeEdit(){

    editingId = null;

    $("#editModal")
        .classList
        .remove(
            "show"
        );

}


$("#closeModal")
    .addEventListener(
        "click",
        closeEdit
    );

$("#cancelEdit")
    .addEventListener(
        "click",
        closeEdit
    );


$("#editModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id
                ===
                "editModal"
            ){

                closeEdit();

            }

        }
    );


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key
            ===
            "Escape"
        ){

            closeEdit();

        }

    }
);


/* =========================================================
   保存编辑
========================================================= */

$("#saveEdit")
    .addEventListener(
        "click",
        async () => {


            if(
                editingId === null
            )
                return;


            const button =
                $("#saveEdit");


            button.disabled =
                true;

            button.textContent =
                "保存中…";


            const updates = {

                sell_date:
                    $("#editSellDate")
                        .value,

                expire_date:
                    $("#editExpireDate")
                        .value,

                price:
                    Number(
                        $("#editPrice")
                            .value
                        ||
                        0
                    ),

                buyer_email:
                    $("#editBuyerEmail")
                        .value
                        .trim(),

                project_no:
                    $("#editProjectNo")
                        .value
                        .trim(),

                operator:
                    $("#editOperator")
                        .value

            };


            const {
                error
            } =
                await sb

                .from(
                    "sales_list"
                )

                .update(
                    updates
                )

                .eq(
                    "id",
                    editingId
                );


            button.disabled =
                false;

            button.textContent =
                "保存修改";


            if(error){

                notify(
                    "保存失败：" +
                    error.message,
                    "error"
                );

                return;

            }


            closeEdit();

            notify(
                "修改已保存",
                "success"
            );

            await loadData();

        }
    );


/* =========================================================
   刷新
========================================================= */

btnRefresh.addEventListener(

    () =>
        loadData(true)
);

topRefresh.addEventListener(

/* =========================================================
   CSV
========================================================= */

btnExport.addEventListener(
    "click",
    () => {

        if(
            !allRows.length
        ){

            notify(
                "当前没有数据",
                "error"
            );

            return;

        }


        const header = [
            "序号",
            "售卖日期",
            "截止日期",
            "售价",
            "买家邮箱",
            "项目号",
            "是否已删除",
            "操作人"
        ];


        let csv =
            "\uFEFF"
            +
            header.join(",")
            +
            "\n";


        allRows.forEach(
            (
                row,
                index
            ) => {

                const values = [

                    index + 1,

                    row.sell_date || "",

                    row.expire_date || "",

                    row.price || 0,

                    row.buyer_email || "",

                    row.project_no || "",

                    row.is_deleted || "",

                    row.operator || ""

                ];

                csv +=
                    values
                    .map(
                        value =>
                            `"${String(value)
                                .replaceAll(
                                    '"',
                                    '""'
                                )}"`
                    )
                    .join(",")
                    +
                    "\n";

            }
        );


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;

        a.download =
            "挣钱上三亚_销售记录.csv";

        document.body
            .appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(
            url
        );


        notify(
            "CSV 已导出",
            "success"
        );

    }
);

   Footer
========================================================= */

$("#year")
    .textContent =
    new Date()
        .getFullYear();

   初始化
========================================================= */

window.addEventListener(

);
