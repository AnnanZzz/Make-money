<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>挣钱上三亚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        linear-gradient(rgba(255,255,255,.62), rgba(255,255,255,.62)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1400&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    max-width: 1250px;
    margin: 20px auto;
    padding: 16px;
}

.form-box {
    background: #ffffffdd;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 1px 6px #00000022;
}

.row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.item {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

input,
select {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    min-width: 142px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.btn-del {
    background: #dc2626;
}

.btn-del:hover {
    background: #b91c1c;
}

.btn-toggle-del {
    background: #059669;
}

.btn-toggle-del:hover {
    background: #047857;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffffdd;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 6px #00000020;
}

th,
td {
    border: 1px solid #e2e8f0;
    padding: 9px 10px;
    font-size: 13px;
    word-break: break-word;
}

th {
    background: #dbeafe;
}

.total-bar {
    padding: 12px;
    background: #dbeafecc;
    border-radius: 8px;
    margin: 10px 0;
    font-weight: bold;
    font-size: 15px;
}

.status-bar {
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 7px;
    background: #f1f5f9;
    font-size: 13px;
}

.status-ok {
    background: #dcfce7;
    color: #166534;
}

.status-error {
    background: #fee2e2;
    color: #991b1b;
}

.table-wrap {
    overflow-x: auto;
}
</style>
</head>

<body>

<div class="container">

    <h2>挣钱上三亚</h2>

    <div id="statusBar" class="status-bar">
        正在连接数据库...
    </div>

    <div class="form-box">

        <div class="row">

            <div class="item">
                <label>售卖日期</label>
                <input type="date" id="sellDate">
            </div>

            <div class="item">
                <label>截止日期</label>
                <input type="date" id="expireDate">
            </div>

            <div class="item">
                <label>售卖价格(元)</label>
                <input
                    type="number"
                    id="price"
                    placeholder="输入金额"
                    step="0.01"
                >
            </div>

            <div class="item">
                <label>买家邮箱</label>
                <input
                    type="text"
                    id="buyerEmail"
                    placeholder="买家邮箱"
                >
            </div>

            <div class="item">
                <label>项目号</label>
                <input
                    type="text"
                    id="projectNo"
                    placeholder="项目编号"
                >
            </div>

            <div class="item">
                <label>操作人</label>

                <select id="operator">
                    <option value="崔囤月">崔囤月</option>
                    <option value="刘俊屹">刘俊屹</option>
                    <option value="曾安南" selected>曾安南</option>
                </select>

            </div>

        </div>

        <div class="row">

            <button id="btnAdd">
                新增记录
            </button>

            <button id="btnRefresh">
                刷新数据
            </button>

            <button id="btnExport">
                导出备份(CSV)
            </button>

        </div>

    </div>

    <div
        class="total-bar"
        id="totalBar"
    >
        合计（共0条） ¥0.00
    </div>

    <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>序号</th>
                    <th>售卖日期</th>
                    <th>截止日期</th>
                    <th>售价(元)</th>
                    <th>买家邮箱</th>
                    <th>项目号</th>
                    <th>是否已删除</th>
                    <th>操作人</th>
                    <th>操作</th>
                </tr>

            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>


<script>

(function () {

    /*
    ========================================
    Supabase 配置
    ========================================
    */

    const SUPABASE_URL =
        "https://dufemmclialublrxzwny.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_G1lGo2yiVKzQeNFiJdG6Dg_HCdWFEFU";


    /*
    ========================================
    创建 Supabase 客户端
    明确指定 public schema
    ========================================
    */

    const { createClient } = window.supabase;

    const sb = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            db: {
                schema: "public"
            }
        }
    );


    /*
    ========================================
    获取页面元素
    ========================================
    */

    const tableBody =
        document.getElementById("tableBody");

    const totalBar =
        document.getElementById("totalBar");

    const statusBar =
        document.getElementById("statusBar");

    const sellDateEl =
        document.getElementById("sellDate");

    const expireDateEl =
        document.getElementById("expireDate");

    const priceEl =
        document.getElementById("price");

    const buyerEmailEl =
        document.getElementById("buyerEmail");

    const projectNoEl =
        document.getElementById("projectNo");

    const operatorEl =
        document.getElementById("operator");

    const btnAdd =
        document.getElementById("btnAdd");

    const btnRefresh =
        document.getElementById("btnRefresh");

    const btnExport =
        document.getElementById("btnExport");


    /*
    ========================================
    状态提示
    ========================================
    */

    function showStatus(message, type = "") {

        statusBar.textContent = message;

        statusBar.className = "status-bar";

        if (type === "ok") {
            statusBar.classList.add("status-ok");
        }

        if (type === "error") {
            statusBar.classList.add("status-error");
        }

    }


    /*
    ========================================
    HTML 安全转义
    防止邮箱、项目号等内容破坏页面
    ========================================
    */

    function escapeHtml(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /*
    ========================================
    读取数据库
    ========================================
    */

    async function loadData() {

        console.log("正在读取 sales_list");

        showStatus("正在读取数据库...");

        const { data, error } = await sb
            .from("sales_list")
            .select("*")
            .order("expire_date", {
                ascending: true
            });


        if (error) {

            console.error(
                "读取数据失败：",
                error
            );

            showStatus(
                "数据库连接失败：" +
                error.message,
                "error"
            );

            return;

        }


        console.log(
            "读取成功：",
            data
        );

        showStatus(
            "数据库连接正常，共读取 " +
            data.length +
            " 条记录",
            "ok"
        );

        renderTable(data);

    }


    /*
    ========================================
    显示表格
    ========================================
    */

    function renderTable(list) {

        tableBody.innerHTML = "";

        let sum = 0;


        list.forEach((row, index) => {

            sum += Number(
                row.price || 0
            );


            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(row.sell_date)}
                </td>

                <td>
                    ${escapeHtml(row.expire_date)}
                </td>

                <td>
                    ${Number(row.price || 0).toFixed(2)}
                </td>

                <td>
                    ${escapeHtml(row.buyer_email)}
                </td>

                <td>
                    ${escapeHtml(row.project_no)}
                </td>

                <td>
                    ${escapeHtml(
                        row.is_deleted || "未删除"
                    )}
                </td>

                <td>
                    ${escapeHtml(row.operator)}
                </td>

                <td>

                    <button
                        class="btn-toggle-del"
                        data-id="${row.id}"
                        data-status="${escapeHtml(
                            row.is_deleted || "未删除"
                        )}"
                    >
                        切换删除状态
                    </button>

                    <button
                        class="btn-del"
                        data-id="${row.id}"
                    >
                        删除整行
                    </button>

                </td>

            `;


            tableBody.appendChild(tr);

        });


        totalBar.innerText =
            `合计（共${list.length}条） ¥${sum.toFixed(2)}`;


        /*
        切换删除状态
        */

        document
            .querySelectorAll(".btn-toggle-del")
            .forEach(btn => {

                btn.onclick =
                    async function () {

                        const rid =
                            Number(
                                this.dataset.id
                            );

                        const currStatus =
                            this.dataset.status;

                        const newStatus =
                            currStatus === "未删除"
                                ? "已删除"
                                : "未删除";


                        this.disabled = true;


                        const {
                            error
                        } = await sb
                            .from("sales_list")
                            .update({
                                is_deleted:
                                    newStatus
                            })
                            .eq(
                                "id",
                                rid
                            );


                        this.disabled = false;


                        if (error) {

                            console.error(
                                "更新状态失败：",
                                error
                            );

                            alert(
                                "更新失败：" +
                                error.message
                            );

                            return;

                        }


                        await loadData();

                    };

            });


        /*
        永久删除
        */

        document
            .querySelectorAll(".btn-del")
            .forEach(btn => {

                btn.onclick =
                    async function () {

                        const rid =
                            Number(
                                this.dataset.id
                            );


                        const confirmed =
                            confirm(
                                "确定要永久删除这一行吗？\n\n删除后无法恢复。"
                            );


                        if (!confirmed) {
                            return;
                        }


                        this.disabled = true;


                        const {
                            error
                        } = await sb
                            .from("sales_list")
                            .delete()
                            .eq(
                                "id",
                                rid
                            );


                        this.disabled = false;


                        if (error) {

                            console.error(
                                "删除失败：",
                                error
                            );

                            alert(
                                "删除失败：" +
                                error.message
                            );

                            return;

                        }


                        await loadData();

                    };

            });

    }


    /*
    ========================================
    新增数据
    ========================================
    */

    btnAdd.onclick =
        async function () {

            console.log(
                "点击新增记录"
            );


            const payload = {

                sell_date:
                    sellDateEl.value,

                expire_date:
                    expireDateEl.value,

                price:
                    Number(
                        priceEl.value || 0
                    ),

                buyer_email:
                    buyerEmailEl
                        .value
                        .trim(),

                project_no:
                    projectNoEl
                        .value
                        .trim(),

                operator:
                    operatorEl.value,

                is_deleted:
                    "未删除"

            };


            /*
            简单验证
            */

            if (
                !payload.sell_date
                &&
                !payload.expire_date
                &&
                !payload.buyer_email
                &&
                !payload.project_no
            ) {

                alert(
                    "请至少填写一些记录内容。"
                );

                return;

            }


            btnAdd.disabled = true;

            btnAdd.textContent =
                "正在新增...";


            const {
                data,
                error
            } = await sb
                .from("sales_list")
                .insert([
                    payload
                ])
                .select();


            btnAdd.disabled = false;

            btnAdd.textContent =
                "新增记录";


            if (error) {

                console.error(
                    "新增错误：",
                    error
                );

                alert(
                    "新增失败：\n" +
                    JSON.stringify(
                        error,
                        null,
                        2
                    )
                );

                return;

            }


            console.log(
                "新增成功：",
                data
            );


            /*
            清空输入框
            */

            sellDateEl.value = "";

            expireDateEl.value = "";

            priceEl.value = "";

            buyerEmailEl.value = "";

            projectNoEl.value = "";

            operatorEl.value =
                "曾安南";


            alert(
                "新增成功！"
            );


            await loadData();

        };


    /*
    ========================================
    手动刷新
    ========================================
    */

    btnRefresh.onclick =
        async function () {

            await loadData();

        };


    /*
    ========================================
    CSV 导出
    ========================================
    */

    btnExport.onclick =
        function () {

            const headers = [
                "序号",
                "售卖日期",
                "截止日期",
                "售价(元)",
                "买家邮箱",
                "项目号",
                "是否已删除",
                "操作人"
            ];


            let csvContent =
                "\uFEFF" +
                headers.join(",") +
                "\n";


            const rows =
                Array.from(
                    tableBody
                        .querySelectorAll("tr")
                );


            rows.forEach(tr => {

                const tds =
                    Array.from(
                        tr.querySelectorAll("td")
                    )
                    .slice(0, 8)
                    .map(td => {

                        const text =
                            td.innerText
                                .replaceAll(
                                    '"',
                                    '""'
                                );

                        return `"${text}"`;

                    });


                csvContent +=
                    tds.join(",") +
                    "\n";

            });


            const blob =
                new Blob(
                    [
                        csvContent
                    ],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href = url;

            a.download =
                "挣钱上三亚_导出.csv";


            document.body
                .appendChild(a);


            a.click();


            document.body
                .removeChild(a);


            URL.revokeObjectURL(url);

        };


    /*
    ========================================
    页面打开后自动加载
    ========================================
    */

    window.addEventListener(
        "load",
        loadData
    );

})();

</script>

</body>
</html>
