<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F4F0E8">

<title>挣钱上三亚 · Sanya Sales</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   DESIGN SYSTEM
========================================================= */

:root{
    --bg:#f3f0e9;
    --surface:#fffdf9;
    --surface-soft:#f8f5ef;

    --ink:#162c2a;
    --ink-soft:#536866;
    --muted:#899693;

    --ocean:#174b47;
    --ocean-2:#246861;
    --ocean-3:#7fae9f;

    --sand:#d8bb88;
    --sand-soft:#eee0c4;

    --green:#2f7d65;
    --green-soft:#e4f1eb;

    --amber:#aa7726;
    --amber-soft:#f8eed9;

    --red:#af5656;
    --red-soft:#f7e4e4;

    --border:rgba(21,51,47,.10);

    --shadow:
        0 18px 60px rgba(39,61,56,.08);

    --shadow-hover:
        0 24px 70px rgba(39,61,56,.13);

    --radius-xl:30px;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    background:var(--bg);
    color:var(--ink);

    font-family:
        Inter,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        -apple-system,
        sans-serif;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

button,
input,
select{
    font:inherit;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;
    height:560px;
    overflow:hidden;

    background:#7ea69a;
}


/* 海景照片 */

.hero-photo{
    position:absolute;
    inset:-6%;

    background-image:
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=92");

    background-size:cover;
    background-position:center 58%;

    transform:scale(1.08);

    animation:
        heroMove 24s ease-in-out infinite alternate;

    will-change:transform;
}

@keyframes heroMove{
    0%{
        transform:
            scale(1.08)
            translate3d(-1.4%,0,0);
    }

    100%{
        transform:
            scale(1.16)
            translate3d(1.8%,-1%,0);
    }
}


/* 调色层 */

.hero-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(11,35,32,.70) 0%,
            rgba(11,35,32,.44) 37%,
            rgba(11,35,32,.10) 72%,
            rgba(11,35,32,.02) 100%
        ),
        linear-gradient(
            180deg,
            rgba(8,30,28,.10),
            rgba(8,30,28,.05) 58%,
            rgba(8,30,28,.43)
        );
}


/* 海面微光 */

.water-light{
    position:absolute;

    left:35%;
    right:-10%;
    bottom:-80px;

    height:260px;

    opacity:.45;

    background:
        repeating-linear-gradient(
            -8deg,
            transparent 0 17px,
            rgba(255,255,255,.13) 18px 20px,
            transparent 21px 37px
        );

    filter:blur(1px);

    transform:skewX(-6deg);

    animation:
        waterMove 8s linear infinite;
}

@keyframes waterMove{
    from{
        transform:
            translateX(-30px)
            skewX(-6deg);
    }

    to{
        transform:
            translateX(30px)
            skewX(-6deg);
    }
}


/* 光晕 */

.hero-glow{
    position:absolute;

    width:650px;
    height:650px;

    right:-170px;
    top:-290px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,225,169,.40),
            rgba(255,217,150,.08) 46%,
            transparent 70%
        );

    filter:blur(8px);

    animation:
        glow 8s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        opacity:.68;
        transform:scale(.94);
    }

    to{
        opacity:1;
        transform:scale(1.07);
    }
}


/* Hero 内容 */

.hero-inner{
    width:min(1480px,calc(100% - 64px));
    height:100%;

    margin:auto;

    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;

    padding-bottom:35px;
}


.hero-kicker{
    display:flex;
    align-items:center;
    gap:10px;

    color:rgba(255,255,255,.76);

    font-size:13px;
    font-weight:600;

    letter-spacing:.18em;

    margin-bottom:22px;
}


.hero-kicker::before{
    content:"";

    width:30px;
    height:1px;

    background:var(--sand-soft);
}


.hero-title{
    margin:0;

    color:#fffdf6;

    font-weight:520;

    font-size:clamp(54px,6vw,82px);

    line-height:1;
    letter-spacing:-.055em;
}


.hero-title strong{
    color:#f2d8aa;
    font-weight:620;
}


.hero-copy{
    max-width:610px;

    margin:
        22px 0 0;

    color:rgba(255,255,255,.82);

    font-size:18px;
    line-height:1.8;

    letter-spacing:.01em;
}


.hero-bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:110px;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(243,240,233,.06)
        );
}


/* =========================================================
   MAIN
========================================================= */

.app{
    width:min(1480px,calc(100% - 48px));

    margin:-62px auto 90px;

    position:relative;
    z-index:10;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        1.45fr
        repeat(3,1fr);

    gap:16px;

    margin-bottom:18px;
}


.stat-card{
    min-height:172px;

    padding:25px 27px;

    border-radius:var(--radius-lg);

    background:rgba(255,253,249,.94);

    border:1px solid rgba(255,255,255,.92);

    box-shadow:var(--shadow);

    position:relative;
    overflow:hidden;

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}


.stat-card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow-hover);
}


.stat-card.primary{
    background:
        linear-gradient(
            135deg,
            #183f3b,
            #235b55
        );

    color:#fff;
}


.stat-label{
    font-size:12px;

    font-weight:700;

    letter-spacing:.13em;

    color:var(--muted);
}


.primary .stat-label{
    color:rgba(255,255,255,.58);
}


.stat-value{
    margin-top:17px;

    font-size:
        clamp(
            34px,
            3.7vw,
            52px
        );

    font-weight:620;

    letter-spacing:-.045em;

    line-height:1;
}


.primary .stat-value{
    color:#f6e2ba;
}


.stat-caption{
    margin-top:13px;

    font-size:15px;

    color:var(--ink-soft);
}


.primary .stat-caption{
    color:rgba(255,255,255,.68);
}


.stat-decoration{
    position:absolute;

    right:-35px;
    bottom:-50px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(215,188,139,.20),
            transparent 67%
        );
}


/* =========================================================
   PANEL
========================================================= */

.panel{
    margin-bottom:18px;

    padding:30px;

    border-radius:var(--radius-xl);

    background:rgba(255,253,249,.96);

    border:1px solid rgba(255,255,255,.90);

    box-shadow:var(--shadow);
}


.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:18px;

    margin-bottom:25px;
}


.panel-heading{
    display:flex;
    align-items:center;

    gap:15px;
}


.panel-icon{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:#edf3ef;

    color:var(--ocean);

    font-size:22px;
    font-weight:400;
}


.panel-heading h2,
.panel-heading h3{
    margin:0;

    font-size:22px;

    font-weight:650;

    letter-spacing:-.025em;
}


.panel-heading p{
    margin:
        5px 0 0;

    color:var(--muted);

    font-size:14px;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(6,minmax(130px,1fr));

    gap:14px;
}


.field{
    display:flex;
    flex-direction:column;

    gap:9px;
}


.field label{
    color:#516764;

    font-size:14px;

    font-weight:600;
}


.input,
.select{
    width:100%;
    height:53px;

    padding:
        0 15px;

    border:1px solid #dce4e1;

    border-radius:14px;

    background:#fbfaf6;

    outline:none;

    color:#203e3a;

    font-size:15px;

    transition:
        border .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}


.input::placeholder{
    color:#a1afac;
}


.input:focus,
.select:focus{
    background:#fff;

    border-color:#739b91;

    box-shadow:
        0 0 0 4px
        rgba(69,118,106,.09);
}


.form-actions{
    display:flex;

    gap:10px;

    margin-top:22px;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
    min-height:48px;

    padding:
        0 19px;

    border:0;

    border-radius:13px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    cursor:pointer;

    font-size:15px;

    font-weight:650;

    transition:
        transform .20s ease,
        box-shadow .20s ease,
        background .20s ease;
}


.btn:hover{
    transform:translateY(-2px);
}


.btn-primary{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #245e57,
            #174641
        );

    box-shadow:
        0 10px 24px
        rgba(25,71,64,.18);
}


.btn-primary:hover{
    box-shadow:
        0 15px 30px
        rgba(25,71,64,.25);
}


.btn-secondary{
    color:#425f5b;

    background:#f2f4ef;

    border:1px solid #dde5e1;
}


.btn-secondary:hover{
    background:#e9eeea;
}


.btn-danger{
    color:var(--red);

    background:#fbefef;
}


.btn:disabled{
    opacity:.55;
    cursor:wait;
    transform:none;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:16px;

    margin-bottom:18px;
}


.toolbar-title h3{
    margin:0;

    font-size:22px;

    font-weight:650;
}


.toolbar-title p{
    margin:
        6px 0 0;

    color:var(--muted);

    font-size:14px;
}


.toolbar-actions{
    display:flex;

    gap:9px;

    flex-wrap:wrap;
}


.search{
    position:relative;
}


.search-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#83928f;

    font-size:16px;
}


.search-input{
    width:315px;
    height:48px;

    padding:
        0 16px 0 43px;

    border:1px solid #dce5e2;

    border-radius:13px;

    outline:none;

    background:#fbfaf6;

    color:#304c48;

    font-size:15px;
}


.search-input::placeholder{
    color:#a2aeac;
}


/* =========================================================
   TABLE
========================================================= */

.table-shell{
    overflow:auto;

    border:
        1px solid #e1e8e5;

    border-radius:20px;

    background:#fff;
}


table{
    width:100%;

    min-width:1220px;

    border-collapse:collapse;
}


thead{
    background:#f6f5f0;
}


th{
    padding:
        17px 16px;

    text-align:left;

    color:#748480;

    font-size:13px;

    font-weight:700;

    letter-spacing:.035em;

    white-space:nowrap;
}


td{
    padding:
        19px 16px;

    border-top:
        1px solid #edf0ee;

    color:#3c5652;

    font-size:15px;

    line-height:1.45;

    vertical-align:middle;
}


tbody tr{
    transition:
        background .18s ease;
}


tbody tr:hover{
    background:#fafaf6;
}


.row-number{
    color:#99a5a2;

    font-weight:600;
}


.price{
    color:#235d54;

    font-size:16px;

    font-weight:700;

    white-space:nowrap;
}


.email-cell{
    max-width:260px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================================================
   BADGES
========================================================= */

.badge{
    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:
        7px 11px;

    border-radius:999px;

    font-size:13px;

    font-weight:650;

    white-space:nowrap;
}


.badge::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;
}


.badge-ok{
    color:var(--green);
    background:var(--green-soft);
}

.badge-ok::before{
    background:#58a486;
}


.badge-warning{
    color:var(--amber);
    background:var(--amber-soft);
}

.badge-warning::before{
    background:#cf9a3c;
}


.badge-expired{
    color:var(--red);
    background:var(--red-soft);
}

.badge-expired::before{
    background:#cd7272;
}


.badge-deleted{
    color:#7b8886;
    background:#eff1ef;
}

.badge-deleted::before{
    background:#98a39f;
}


/* =========================================================
   ROW ACTIONS
========================================================= */

.row-actions{
    display:flex;

    gap:6px;

    flex-wrap:nowrap;
}


.mini-btn{
    height:36px;

    padding:
        0 11px;

    border-radius:10px;

    border:1px solid #dde5e2;

    background:#fff;

    color:#536c68;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    white-space:nowrap;

    transition:
        background .18s ease,
        border .18s ease;
}


.mini-btn:hover{
    background:#f1f5f2;
}


.mini-btn.edit{
    color:#2c7468;
}


.mini-btn.delete{
    color:#ae5c5c;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{
    display:none;

    padding:
        75px 20px;

    text-align:center;

    color:#889995;

    font-size:15px;
}


.empty-circle{
    width:52px;
    height:52px;

    display:grid;
    place-items:center;

    margin:
        0 auto 14px;

    border-radius:50%;

    background:#edf2ee;

    color:#67807a;

    font-size:21px;
}


/* =========================================================
   MODAL
========================================================= */

.modal-mask{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:22px;

    background:rgba(13,35,32,.42);

    backdrop-filter:blur(12px);
}


.modal-mask.show{
    display:flex;
}


.modal{
    width:min(760px,100%);

    max-height:
        calc(100vh - 44px);

    overflow:auto;

    padding:28px;

    border-radius:28px;

    background:#fffdf9;

    box-shadow:
        0 35px 90px rgba(28,52,47,.25);

    animation:
        modalIn .24s ease;
}


@keyframes modalIn{
    from{
        opacity:0;
        transform:
            translateY(16px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:23px;
}


.modal-header h3{
    margin:0;

    font-size:23px;

    font-weight:650;
}


.modal-close{
    width:40px;
    height:40px;

    border:0;

    border-radius:12px;

    background:#f0f3ef;

    color:#526a65;

    font-size:20px;

    cursor:pointer;
}


.modal-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}


.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:24px;
}


/* =========================================================
   TOAST
========================================================= */

.toast-stack{
    position:fixed;

    right:22px;
    top:22px;

    z-index:200;

    display:flex;
    flex-direction:column;

    gap:9px;
}


.toast{
    width:min(
        390px,
        calc(100vw - 44px)
    );

    padding:
        15px 17px;

    border-radius:14px;

    background:rgba(255,253,249,.96);

    color:#314d48;

    box-shadow:
        0 20px 55px
        rgba(36,61,55,.16);

    border:
        1px solid rgba(255,255,255,.95);

    backdrop-filter:blur(18px);

    font-size:14px;

    animation:
        toastIn .23s ease;
}


.toast.success{
    border-left:
        4px solid #4d997d;
}


.toast.error{
    border-left:
        4px solid #c76c6c;
}


@keyframes toastIn{
    from{
        opacity:0;
        transform:
            translateX(18px);
    }

    to{
        opacity:1;
        transform:
            translateX(0);
    }
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    padding-top:8px;

    text-align:center;

    color:#99a49f;

    font-size:12px;

    letter-spacing:.12em;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1150px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}


@media(max-width:760px){

    .hero{
        height:500px;
    }

    .hero-inner{
        width:
            calc(100% - 36px);

        justify-content:flex-end;

        padding-bottom:105px;
    }

    .hero-title{
        font-size:
            clamp(47px,15vw,66px);
    }

    .hero-copy{
        font-size:16px;
        line-height:1.65;
    }

    .app{
        width:
            calc(100% - 22px);

        margin-top:-55px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .stat-card{
        min-height:145px;

        padding:20px;
    }

    .panel{
        padding:20px;

        border-radius:24px;
    }

    .form-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .toolbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .toolbar-actions{
        width:100%;
    }

    .search{
        width:100%;
    }

    .search-input{
        width:100%;
    }

}


@media(max-width:500px){

    .hero{
        height:470px;
    }

    .hero-kicker{
        font-size:11px;
    }

    .hero-copy{
        max-width:330px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .modal-grid{
        grid-template-columns:1fr;
    }

    .form-actions{
        flex-direction:column;
    }

    .form-actions .btn{
        width:100%;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">

    <div class="hero-photo"></div>
    <div class="hero-overlay"></div>
    <div class="water-light"></div>
    <div class="hero-glow"></div>

    <div class="hero-inner">

        <div class="hero-kicker">
            SANYA · PRIVATE SALES
        </div>

        <h1 class="hero-title">
            挣钱上<strong>三亚</strong>
        </h1>

        <p class="hero-copy">
            认真记录每一次成交。<br>
            我们要去的地方，有阳光、有椰树，也有海。
        </p>

    </div>

    <div class="hero-bottom"></div>

</section>



<div
    class="toast-stack"
    id="toastStack"
></div>



<!-- =========================================================
     APP
========================================================= -->

<main class="app">


<!-- =========================================================
     STATS
========================================================= -->

<section class="stats">

    <article class="stat-card primary">

        <div class="stat-label">
            TOTAL REVENUE
        </div>

        <div
            class="stat-value"
            id="totalAmount"
        >
            ¥0.00
        </div>

        <div class="stat-caption">
            累计销售金额
        </div>

        <div class="stat-decoration"></div>

    </article>


    <article class="stat-card">

        <div class="stat-label">
            PROJECTS
        </div>

        <div
            class="stat-value"
            id="totalCount"
        >
            0
        </div>

        <div class="stat-caption">
            全部销售项目
        </div>

        <div class="stat-decoration"></div>

    </article>


    <article class="stat-card">

        <div class="stat-label">
            ACTIVE
        </div>

        <div
            class="stat-value"
            id="activeCount"
        >

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://dufemmclialublrxzwny.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_G1lGo2yiVKzQeNFiJdG6Dg_HCdWFEFU";


const { createClient } =
    window.supabase;


const sb =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            db:{
                schema:"public"
            }
        }
    );


/* =========================================================
   DOM
========================================================= */

const $ =
    selector =>
        document.querySelector(
            selector
        );


const sellDate =
    $("#sellDate");

const expireDate =
    $("#expireDate");

const price =
    $("#price");

const buyerEmail =
    $("#buyerEmail");

const projectNo =
    $("#projectNo");

const operator =
    $("#operator");


const tableBody =
    $("#tableBody");

const emptyState =
    $("#emptyState");

const searchInput =
    $("#searchInput");

const dbStatus =
    $("#dbStatus");

const toastStack =
    $("#toastStack");


let allRows = [];
let editingId = null;


/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatMoney(value){

    return new Intl.NumberFormat(
        "zh-CN",
        {
            style:"currency",
            currency:"CNY",
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(
        Number(
            value || 0
        )
    );

}


function showToast(
    text,
    type="success"
){

    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type}`;


    toast.textContent =
        text;


    toastStack.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.style.opacity =
                "0";

            toast.style.transform =
                "translateX(18px)";

        },
        2700
    );


    setTimeout(
        () => {

            toast.remove();

        },
        3100
    );

}


function daysUntil(
    dateString
){

    if(!dateString)
        return null;


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const target =
        new Date(
            dateString +
            "T00:00:00"
        );


    return Math.ceil(
        (
            target.getTime()
            -
            today.getTime()
        )
        /
        86400000
    );

}


/* =========================================================
   STATUS
========================================================= */

function getRowStatus(row){

    if(
        row.is_deleted ===
        "已删除"
    ){

        return {
            text:"已删除",
            className:"badge-deleted"
        };

    }


    const days =
        daysUntil(
            row.expire_date
        );


    if(
        days !== null
        &&
        days < 0
    ){

        return {
            text:"已过期",
            className:"badge-expired"
        };

    }


    if(
        days !== null
        &&
        days <= 7
    ){

        return {

            text:
                days === 0
                ?
                "今天到期"
                :
                `${days} 天后到期`,

            className:
                "badge-warning"

        };

    }


    return {
        text:"正常",
        className:"badge-ok"
    };

}


/* =========================================================
   LOAD
========================================================= */

async function loadData(
    showMessage=false
){

    dbStatus.textContent =
        "正在同步 Supabase 数据库…";


    const {
        data,
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .select("*")

        .order(
            "expire_date",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "读取数据失败：",
            error
        );


        dbStatus.textContent =
            "数据库连接失败";


        showToast(
            "读取失败：" +
            error.message,
            "error"
        );


        return;

    }


    allRows =
        data || [];


    dbStatus.textContent =
        `数据库已连接 · ${allRows.length} 条记录`;


    renderStats();

    filterAndRender();


    if(showMessage){

        showToast(
            "数据已刷新"
        );

    }

}


/* =========================================================
   STATS
========================================================= */

function renderStats(){

    const total =
        allRows.reduce(
            (
                sum,
                row
            ) =>
                sum
                +
                Number(
                    row.price || 0
                ),
            0
        );


    const deleted =
        allRows.filter(
            row =>
                row.is_deleted ===
                "已删除"
        ).length;


    $("#totalAmount").textContent =
        formatMoney(total);


    $("#totalCount").textContent =
        allRows.length;


    $("#activeCount").textContent =
        allRows.length
        -
        deleted;


    $("#deletedCount").textContent =
        deleted;

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(rows){

    tableBody.innerHTML = "";


    if(!rows.length){

        emptyState.style.display =
            "block";

        return;

    }


    emptyState.style.display =
        "none";


    rows.forEach(
        (
            row,
            index
        ) => {


            const status =
                getRowStatus(row);


            const tr =
                document.createElement(
                    "tr"
                );


            if(
                row.is_deleted ===
                "已删除"
            ){

                tr.style.opacity =
                    ".54";

            }


            tr.innerHTML =
            `

                <td class="row-number">
                    ${index + 1}
                </td>


                <td>
                    ${escapeHtml(
                        row.sell_date || "—"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        row.expire_date || "—"
                    )}
                </td>


                <td class="price">
                    ${escapeHtml(
                        formatMoney(
                            row.price
                        )
                    )}
                </td>


                <td class="email-cell">
                    ${escapeHtml(
                        row.buyer_email || "—"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        row.project_no || "—"
                    )}
                </td>


                <td>

                    <span
                        class="
                            badge
                            ${status.className}
                        "
                    >
                        ${escapeHtml(
                            status.text
                        )}
                    </span>

                </td>


                <td>
                    ${escapeHtml(
                        row.operator || "—"
                    )}
                </td>


                <td>

                    <div class="row-actions">


                        <button
                            class="
                                mini-btn
                                edit
                            "
                            data-action="edit"
                            data-id="${row.id}"
                        >
                            编辑
                        </button>


                        <button
                            class="mini-btn"
                            data-action="toggle"
                            data-id="${row.id}"
                        >

                            ${
                                row.is_deleted ===
                                "已删除"

                                ?
                                "恢复"

                                :
                                "标记删除"
                            }

                        </button>


                        <button
                            class="
                                mini-btn
                                delete
                            "
                            data-action="delete"
                            data-id="${row.id}"
                        >
                            永久删除
                        </button>


                    </div>

                </td>

            `;


            tableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function filterAndRender(){

    const keyword =
        searchInput
        .value
        .trim()
        .toLowerCase();


    if(!keyword){

        renderTable(
            allRows
        );

        return;

    }


    const rows =
        allRows.filter(
            row => {


                const searchable =
                    [

                        row.sell_date,
                        row.expire_date,
                        row.price,
                        row.buyer_email,
                        row.project_no,
                        row.operator,
                        row.is_deleted

                    ]

                    .join(" ")

                    .toLowerCase();


                return searchable.includes(
                    keyword
                );

            }
        );


    renderTable(
        rows
    );

}


searchInput.addEventListener(
    "input",
    filterAndRender
);


/* =========================================================
   CREATE
========================================================= */

$("#btnAdd")
.addEventListener(
    "click",
    async () => {


        const button =
            $("#btnAdd");


        const payload = {

            sell_date:
                sellDate.value,

            expire_date:
                expireDate.value,

            price:
                Number(
                    price.value || 0
                ),

            buyer_email:
                buyerEmail
                .value
                .trim(),

            project_no:
                projectNo
                .value
                .trim(),

            operator:
                operator.value,

            is_deleted:
                "未删除"

        };


        if(
            !payload.sell_date
            &&
            !payload.expire_date
            &&
            !payload.buyer_email
            &&
            !payload.project_no
        ){

            showToast(
                "请先填写销售记录",
                "error"
            );

            return;

        }


        button.disabled =
            true;


        button.textContent =
            "正在保存…";


        const {
            error
        } =
            await sb

            .from(
                "sales_list"
            )

            .insert([
                payload
            ]);


        button.disabled =
            false;


        button.textContent =
            "＋ 新增销售记录";


        if(error){

            console.error(
                error
            );


            showToast(
                "新增失败：" +
                error.message,
                "error"
            );


            return;

        }


        clearForm();


        showToast(
            "销售记录新增成功"
        );


        await loadData();

    }
);


/* =========================================================
   CLEAR
========================================================= */

function clearForm(){

    sellDate.value = "";
    expireDate.value = "";
    price.value = "";
    buyerEmail.value = "";
    projectNo.value = "";

    operator.value =
        "曾安南";

}


$("#btnClear")
.addEventListener(
    "click",
    clearForm
);


/* =========================================================
   TABLE ACTIONS
========================================================= */

tableBody.addEventListener(
    "click",
    async event => {


        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button)
            return;


        const id =
            Number(
                button.dataset.id
            );


        const action =
            button.dataset.action;


        if(action === "edit"){

            openEdit(id);

        }


        if(action === "toggle"){

            await toggleDelete(id);

        }


        if(action === "delete"){

            await permanentDelete(id);

        }

    }
);


/* =========================================================
   SOFT DELETE
========================================================= */

async function toggleDelete(id){

    const row =
        allRows.find(
            item =>
                Number(item.id)
                ===
                Number(id)
        );


    if(!row)
        return;


    const nextStatus =
        row.is_deleted ===
        "已删除"

        ?
        "未删除"

        :
        "已删除";


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .update({
            is_deleted:
                nextStatus
        })

        .eq(
            "id",
            id
        );


    if(error){

        showToast(
            "更新失败：" +
            error.message,
            "error"
        );

        return;

    }


    showToast(
        nextStatus ===
        "已删除"

        ?
        "已标记删除"

        :
        "记录已恢复"
    );


    await loadData();

}


/* =========================================================
   PERMANENT DELETE
========================================================= */

async function permanentDelete(id){

    const confirmed =
        confirm(
            "确定永久删除这条记录吗？\n\n删除后无法恢复。"
        );


    if(!confirmed)
        return;


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        showToast(
            "删除失败：" +
            error.message,
            "error"
        );

        return;

    }


    showToast(
        "记录已永久删除"
    );


    await loadData();

}


/* =========================================================
   EDIT
========================================================= */

function openEdit(id){

    const row =
        allRows.find(
            item =>
                Number(item.id)
                ===
                Number(id)
        );


    if(!row)
        return;


    editingId =
        Number(id);


    $("#editSellDate").value =
        row.sell_date || "";


    $("#editExpireDate").value =
        row.expire_date || "";


    $("#editPrice").value =
        row.price ?? "";


    $("#editBuyerEmail").value =
        row.buyer_email || "";


    $("#editProjectNo").value =
        row.project_no || "";


    $("#editOperator").value =
        row.operator || "曾安南";


    $("#editModal")
    .classList
    .add(
        "show"
    );

}


function closeEdit(){

    editingId = null;


    $("#editModal")
    .classList
    .remove(
        "show"
    );

}


$("#closeModal")
.addEventListener(
    "click",
    closeEdit
);


$("#cancelEdit")
.addEventListener(
    "click",
    closeEdit
);


$("#editModal")
.addEventListener(
    "click",
    event => {

        if(
            event.target.id ===
            "editModal"
        ){

            closeEdit();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeEdit();

        }

    }
);


/* =========================================================
   SAVE EDIT
========================================================= */

$("#saveEdit")
.addEventListener(
    "click",
    async () => {


        if(
            editingId === null
        )
            return;


        const button =
            $("#saveEdit");


        button.disabled =
            true;


        button.textContent =
            "正在保存…";


        const updates = {

            sell_date:
                $("#editSellDate")
                .value,

            expire_date:
                $("#editExpireDate")
                .value,

            price:
                Number(
                    $("#editPrice")
                    .value
                    ||
                    0
                ),

            buyer_email:
                $("#editBuyerEmail")
                .value
                .trim(),

            project_no:
                $("#editProjectNo")
                .value
                .trim(),

            operator:
                $("#editOperator")
                .value

        };


        const {
            error
        } =
            await sb

            .from(
                "sales_list"
            )

            .update(
                updates
            )

            .eq(
                "id",
                editingId
            );


        button.disabled =
            false;


        button.textContent =
            "保存修改";


        if(error){

            showToast(
                "保存失败：" +
                error.message,
                "error"
            );

            return;

        }


        closeEdit();


        showToast(
            "修改已保存"
        );


        await loadData();

    }
);

/* =========================================================
   EXPORT CSV
========================================================= */

$("#btnExport")
.addEventListener(
    "click",
    () => {


        if(!allRows.length){

            showToast(
                "当前没有可以导出的数据",
                "error"
            );

            return;

        }


        const headers = [

            "序号",
            "售卖日期",
            "截止日期",
            "售价",
            "买家邮箱",
            "项目号",
            "是否已删除",
            "操作人"

        ];


        let csv =
            "\uFEFF"
            +
            headers.join(",")
            +
            "\n";


        allRows.forEach(
            (
                row,
                index
            ) => {


                const values = [

                    index + 1,

                    row.sell_date || "",

                    row.expire_date || "",

                    row.price || 0,

                    row.buyer_email || "",

                    row.project_no || "",

                    row.is_deleted || "",

                    row.operator || ""

                ];


                csv +=
                    values

                    .map(
                        value =>
                            `"${String(value)
                            .replaceAll(
                                '"',
                                '""'
                            )}"`
                    )

                    .join(",")

                    +
                    "\n";

            }
        );


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const anchor =
            document.createElement(
                "a"
            );


        anchor.href =
            url;


        anchor.download =
            "挣钱上三亚_销售记录.csv";


        document.body
        .appendChild(
            anchor
        );


        anchor.click();


        anchor.remove();


        URL.revokeObjectURL(
            url
        );


        showToast(
            "CSV 导出完成"
        );

    }
);


/* =========================================================
   INIT
========================================================= */

$("#year").textContent =
    new Date()
    .getFullYear();


window.addEventListener(
    "load",
    async () => {

        await loadData();

    }
);

</script>

</html>
