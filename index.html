<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3ED">

<title>挣钱上三亚 · Sales Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   01. DESIGN SYSTEM
========================================================= */

:root{
    --page:#f4f2ed;
    --surface:#fffdf9;
    --surface-soft:#f8f6f1;

    --ink:#16322f;
    --ink-2:#405b57;
    --muted:#7f918d;

    --green:#214f49;
    --green-2:#2c6860;
    --green-soft:#e9f2ef;

    --sand:#c9a974;
    --sand-soft:#efe3cb;

    --success:#367d61;
    --success-bg:#e8f4ee;

    --warning:#9c742e;
    --warning-bg:#faf0da;

    --danger:#a75555;
    --danger-bg:#f8e9e8;

    --border:#e3e7e2;

    --shadow:
        0 18px 55px rgba(35,55,49,.08);

    --shadow-hover:
        0 24px 70px rgba(35,55,49,.12);

    --radius-xl:32px;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:12px;
}


/* =========================================================
   02. RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    color:var(--ink);
    background:var(--page);

    font-family:
        Inter,
        "SF Pro Text",
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        -apple-system,
        sans-serif;

    font-size:16px;
    line-height:1.55;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

button,
input,
select{
    font:inherit;
}


/* =========================================================
   03. HERO
========================================================= */

.hero{
    position:relative;

    min-height:520px;

    display:flex;
    align-items:center;

    overflow:hidden;

    background:#557b75;
}


/*
  不再移动背景。
  避免之前那种海面推拉带来的晕眩感。
*/

.hero-photo{
    position:absolute;
    inset:0;

    background-image:
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=92");

    background-size:cover;
    background-position:center 54%;

    transform:scale(1.01);
}


/* 暗部渐变 */

.hero-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(10,31,29,.74) 0%,
            rgba(10,31,29,.53) 37%,
            rgba(10,31,29,.18) 67%,
            rgba(10,31,29,.06) 100%
        ),
        linear-gradient(
            180deg,
            rgba(10,30,28,.08),
            rgba(10,30,28,.12) 60%,
            rgba(10,30,28,.38)
        );
}


/* 非移动式微光 */

.hero-light{
    position:absolute;

    right:-180px;
    top:-230px;

    width:650px;
    height:650px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,229,183,.26),
            rgba(255,229,183,.08) 43%,
            transparent 70%
        );

    pointer-events:none;

    animation:
        lightBreath 9s ease-in-out infinite alternate;
}


@keyframes lightBreath{

    from{
        opacity:.72;
    }

    to{
        opacity:1;
    }

}


/* =========================================================
   04. HERO CONTENT
========================================================= */

.hero-inner{
    position:relative;
    z-index:5;

    width:min(1440px,calc(100% - 72px));

    margin:auto;
}


.hero-kicker{
    display:flex;
    align-items:center;

    gap:12px;

    margin-bottom:22px;

    color:rgba(255,255,255,.76);

    font-size:clamp(12px,1vw,14px);

    font-weight:650;

    letter-spacing:.18em;
}


.hero-kicker::before{
    content:"";

    width:34px;
    height:1px;

    background:rgba(255,255,255,.66);
}


.hero-title{
    margin:0;

    max-width:850px;

    color:#fffdf7;

    font-size:
        clamp(
            48px,
            6vw,
            78px
        );

    font-weight:620;

    line-height:1.08;

    letter-spacing:-.045em;
}


/*
  “三亚”不再突兀黄色。
  仅做非常克制的暖白区分。
*/

.hero-title .accent{
    color:#f3e1bd;
}


.hero-copy{
    margin:
        24px 0 0;

    max-width:660px;

    color:rgba(255,255,255,.84);

    font-size:
        clamp(
            17px,
            1.35vw,
            20px
        );

    line-height:1.8;
}


/* =========================================================
   05. MAIN LAYOUT
========================================================= */

.app{
    width:min(1440px,calc(100% - 48px));

    margin:34px auto 90px;
}


/* =========================================================
   06. STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        1.35fr
        repeat(3,1fr);

    gap:16px;

    margin-bottom:20px;
}


.stat{
    min-height:168px;

    padding:27px;

    position:relative;

    overflow:hidden;

    border-radius:var(--radius-lg);

    background:var(--surface);

    border:1px solid rgba(255,255,255,.85);

    box-shadow:var(--shadow);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


.stat:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-hover);
}


.stat.primary{
    color:#fff;

    background:
        linear-gradient(
            145deg,
            #183f3a,
            #255d55
        );
}


.stat-label{
    color:var(--muted);

    font-size:13px;

    font-weight:750;

    letter-spacing:.12em;
}


.primary .stat-label{
    color:rgba(255,255,255,.58);
}


.stat-value{
    margin-top:18px;

    font-size:
        clamp(
            38px,
            3.6vw,
            54px
        );

    font-weight:650;

    line-height:1;

    letter-spacing:-.04em;
}


.primary .stat-value{
    color:#f3dfb9;
}


.stat-caption{
    margin-top:15px;

    color:var(--ink-2);

    font-size:16px;
}


.primary .stat-caption{
    color:rgba(255,255,255,.72);
}


.stat-orb{
    position:absolute;

    width:170px;
    height:170px;

    right:-75px;
    bottom:-95px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(202,173,119,.21),
            transparent 67%
        );
}


/* =========================================================
   07. PANEL
========================================================= */

.panel{
    margin-bottom:20px;

    padding:32px;

    border-radius:var(--radius-xl);

    background:var(--surface);

    border:1px solid rgba(255,255,255,.90);

    box-shadow:var(--shadow);
}


.panel-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:18px;

    margin-bottom:28px;
}


.panel-title{
    display:flex;

    align-items:center;

    gap:15px;
}


.panel-icon{
    width:50px;
    height:50px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:var(--green-soft);

    color:var(--green);

    font-size:24px;
}


.panel-title h2,
.panel-title h3{
    margin:0;

    color:var(--ink);

    font-size:
        clamp(
            21px,
            1.8vw,
            25px
        );

    font-weight:680;

    letter-spacing:-.025em;
}


.panel-title p{
    margin:
        5px 0 0;

    color:var(--muted);

    font-size:15px;
}


/* =========================================================
   08. FORM
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:20px 16px;
}


.field{
    display:flex;
    flex-direction:column;

    gap:9px;
}


.field label{
    color:#435e59;

    font-size:15px;

    font-weight:650;
}


.input,
.select{
    width:100%;

    min-height:56px;

    padding:
        0 16px;

    color:#243f3a;

    background:#faf9f5;

    border:1px solid #dfe5e1;

    border-radius:15px;

    outline:none;

    font-size:16px;

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}


.input::placeholder{
    color:#9da9a6;
}


.input:focus,
.select:focus{
    background:#fff;

    border-color:#71958c;

    box-shadow:
        0 0 0 4px
        rgba(45,96,85,.08);
}


.form-actions{
    display:flex;

    gap:11px;

    margin-top:24px;
}


/* =========================================================
   09. BUTTONS
========================================================= */

.btn{
    min-height:50px;

    padding:
        0 20px;

    border:0;

    border-radius:14px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    cursor:pointer;

    font-size:16px;

    font-weight:680;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}


.btn:hover{
    transform:translateY(-2px);
}


.btn-primary{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #285f57,
            #173f3a
        );

    box-shadow:
        0 10px 25px
        rgba(24,69,62,.18);
}


.btn-primary:hover{
    box-shadow:
        0 15px 32px
        rgba(24,69,62,.25);
}


.btn-secondary{
    color:#405c57;

    background:#f2f4ef;

    border:1px solid #dfe5e1;
}


.btn-secondary:hover{
    background:#e9eeea;
}


.btn:disabled{
    opacity:.55;
    cursor:wait;
    transform:none;
}


/* =========================================================
   10. TOOLBAR
========================================================= */

.toolbar{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:18px;

    margin-bottom:20px;
}


.toolbar-heading h3{
    margin:0;

    font-size:
        clamp(
            22px,
            1.8vw,
            26px
        );

    font-weight:680;
}


.toolbar-heading p{
    margin:
        6px 0 0;

    color:var(--muted);

    font-size:15px;
}


.toolbar-actions{
    display:flex;

    align-items:center;

    gap:10px;
}


.search{
    position:relative;
}


.search-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#81918e;
}


.search-input{
    width:330px;

    height:50px;

    padding:
        0 16px 0 43px;

    border:1px solid #dfe5e1;

    border-radius:14px;

    outline:none;

    color:#304b46;

    background:#faf9f5;

    font-size:16px;
}


/* =========================================================
   11. DESKTOP TABLE
========================================================= */

.desktop-table{
    display:block;
}


.table-shell{
    overflow-x:auto;

    border:1px solid #e3e8e4;

    border-radius:20px;

    background:#fff;
}


table{
    width:100%;

    min-width:1220px;

    border-collapse:collapse;
}


thead{
    background:#f6f5f1;
}


th{
    padding:
        18px 16px;

    text-align:left;

    color:#71827e;

    font-size:14px;

    font-weight:750;

    letter-spacing:.025em;

    white-space:nowrap;
}


td{
    padding:
        20px 16px;

    border-top:
        1px solid #ecefec;

    color:#38534e;

    font-size:16px;

    line-height:1.45;

    vertical-align:middle;
}


tbody tr{
    transition:
        background .16s ease;
}


tbody tr:hover{
    background:#fafaf7;
}


.row-index{
    color:#899894;

    font-weight:650;
}


.price{
    color:#215d53;

    font-size:17px;

    font-weight:720;

    white-space:nowrap;
}


.email{
    max-width:280px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================================================
   12. STATUS BADGE
========================================================= */

.badge{
    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:
        8px 11px;

    border-radius:999px;

    font-size:14px;

    font-weight:680;

    white-space:nowrap;
}


.badge::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;
}


.badge-ok{
    color:var(--success);
    background:var(--success-bg);
}


.badge-ok::before{
    background:#55a283;
}


.badge-warning{
    color:var(--warning);
    background:var(--warning-bg);
}


.badge-warning::before{
    background:#d29f45;
}


.badge-expired{
    color:var(--danger);
    background:var(--danger-bg);
}


.badge-expired::before{
    background:#cc7474;
}


.badge-deleted{
    color:#768581;
    background:#eff1ef;
}


.badge-deleted::before{
    background:#94a09d;
}


/* =========================================================
   13. ROW BUTTONS
========================================================= */

.row-actions{
    display:flex;

    gap:7px;

    white-space:nowrap;
}


.mini-btn{
    min-height:38px;

    padding:
        0 12px;

    border-radius:10px;

    border:1px solid #dfe5e1;

    background:#fff;

    color:#4d6862;

    font-size:14px;

    font-weight:650;

    cursor:pointer;
}


.mini-btn:hover{
    background:#f2f5f2;
}


.mini-btn.edit{
    color:#267064;
}


.mini-btn.danger{
    color:#a65a5a;
}


/* =========================================================
   14. MOBILE RECORD CARDS
========================================================= */

.mobile-records{
    display:none;
}


.mobile-card{
    padding:20px;

    margin-bottom:12px;

    border:1px solid #e2e7e3;

    border-radius:20px;

    background:#fff;
}


.mobile-card-top{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:14px;

    margin-bottom:16px;
}


.mobile-project{
    font-size:19px;

    font-weight:720;

    color:var(--ink);
}


.mobile-money{
    margin-top:4px;

    color:#256057;

    font-size:22px;

    font-weight:730;
}


.mobile-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

    padding:
        16px 0;

    border-top:
        1px solid #edf0ed;

    border-bottom:
        1px solid #edf0ed;
}


.mobile-info-label{
    margin-bottom:3px;

    color:#899793;

    font-size:13px;

    font-weight:650;
}


.mobile-info-value{
    color:#405b56;

    font-size:16px;

    word-break:break-word;
}


.mobile-actions{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-top:16px;
}


/* =========================================================
   15. EMPTY
========================================================= */

.empty{
    display:none;

    padding:
        72px 20px;

    text-align:center;

    color:#7f908c;

    font-size:16px;
}


/* =========================================================
   16. MODAL
========================================================= */

.modal-mask{
    position:fixed;
    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:22px;

    background:rgba(12,35,31,.44);

    backdrop-filter:blur(10px);
}


.modal-mask.show{
    display:flex;
}


.modal{
    width:min(780px,100%);

    max-height:
        calc(100vh - 44px);

    overflow-y:auto;

    padding:30px;

    border-radius:30px;

    background:#fffdf9;

    box-shadow:
        0 35px 95px
        rgba(27,53,46,.25);
}


.modal-header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;
}


.modal-header h3{
    margin:0;

    font-size:25px;

    font-weight:680;
}


.modal-close{
    width:42px;
    height:42px;

    border:0;

    border-radius:13px;

    background:#eef2ee;

    color:#4d6862;

    font-size:21px;

    cursor:pointer;
}


.modal-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:16px;
}


.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:25px;
}


/* =========================================================
   17. TOAST
========================================================= */

.toast-stack{
    position:fixed;

    top:22px;
    right:22px;

    z-index:2000;

    display:flex;
    flex-direction:column;

    gap:9px;
}


.toast{
    width:min(
        390px,
        calc(100vw - 44px)
    );

    padding:
        15px 17px;

    border-radius:15px;

    color:#314c47;

    background:rgba(255,253,249,.97);

    border:1px solid white;

    box-shadow:
        0 20px 55px
        rgba(32,59,52,.16);

    font-size:15px;
}


.toast.success{
    border-left:
        4px solid #57997d;
}


.toast.error{
    border-left:
        4px solid #c66d6d;
}


/* =========================================================
   18. FOOTER
========================================================= */

.footer{
    padding-top:12px;

    text-align:center;

    color:#899792;

    font-size:13px;

    letter-spacing:.10em;
}


/* =========================================================
   19. TABLET
========================================================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:
            1fr 1fr;
    }

    .form-grid{
        grid-template-columns:
            1fr 1fr;
    }

    .toolbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .toolbar-actions{
        width:100%;
    }

    .search{
        flex:1;
    }

    .search-input{
        width:100%;
    }

}


/* =========================================================
   20. MOBILE
========================================================= */

@media(max-width:760px){

    body{
        font-size:16px;
    }

    .hero{
        min-height:440px;

        align-items:flex-end;
    }

    .hero-photo{
        background-position:62% center;
    }

    .hero-overlay{
        background:
            linear-gradient(
                180deg,
                rgba(10,31,29,.13) 0%,
                rgba(10,31,29,.30) 38%,
                rgba(10,31,29,.79) 100%
            );
    }

    .hero-inner{
        width:
            calc(100% - 36px);

        padding-bottom:48px;
    }

    .hero-kicker{
        margin-bottom:16px;

        font-size:12px;

        letter-spacing:.12em;
    }

    .hero-title{
        max-width:100%;

        font-size:
            clamp(
                44px,
                14vw,
                62px
            );

        line-height:1.08;

        letter-spacing:-.035em;
    }

    .hero-copy{
        margin-top:18px;

        max-width:420px;

        font-size:17px;

        line-height:1.65;
    }

    .app{
        width:
            calc(100% - 20px);

        margin-top:18px;
    }

    .stats{
        grid-template-columns:
            1fr 1fr;

        gap:10px;
    }

    .stat{
        min-height:145px;

        padding:20px;

        border-radius:20px;
    }

    .stat-label{
        font-size:11px;
    }

    .stat-value{
        margin-top:14px;

        font-size:
            clamp(
                32px,
                10vw,
                42px
            );
    }

    .stat-caption{
        margin-top:11px;

        font-size:14px;
    }

    .panel{
        padding:20px;

        border-radius:24px;
    }

    .panel-header{
        margin-bottom:22px;
    }

    .panel-icon{
        width:46px;
        height:46px;
    }

    .panel-title h2,
    .panel-title h3{
        font-size:21px;
    }

    .panel-title p{
        font-size:14px;
    }

    .form-grid{
        grid-template-columns:1fr;

        gap:16px;
    }

    .field label{
        font-size:15px;
    }

    .input,
    .select{
        min-height:56px;

        font-size:16px;
    }

    .form-actions{
        display:grid;

        grid-template-columns:
            1fr 1fr;
    }

    .btn{
        min-height:52px;

        font-size:16px;
    }

    .toolbar-actions{
        display:grid;

        grid-template-columns:
            1fr 1fr;

        width:100%;
    }

    .search{
        grid-column:
            1 / -1;
    }

    .search-input{
        height:52px;

        font-size:16px;
    }

    /*
      手机上不显示传统横向表格。
      自动切换成大字号卡片。
    */

    .desktop-table{
        display:none;
    }

    .mobile-records{
        display:block;
    }

    .modal{
        padding:22px;

        border-radius:24px;
    }

    .modal-grid{
        grid-template-columns:1fr;
    }

}


/* =========================================================
   21. VERY SMALL PHONE
========================================================= */

@media(max-width:430px){

    .stats{
        grid-template-columns:1fr;
    }

    .stat{
        min-height:135px;
    }

    .hero{
        min-height:420px;
    }

    .hero-title{
        font-size:46px;
    }

    .hero-copy{
        font-size:16px;
    }

    .form-actions{
        grid-template-columns:1fr;
    }

}


/* =========================================================

/* =========================================================

const SUPABASE_URL =

const SUPABASE_KEY =

/* =========================================================

========================================================= */

const $ =

/* =========================================================
   03. UTILITY
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatMoney(value){

    return new Intl.NumberFormat(
        "zh-CN",
        {
            style:"currency",
            currency:"CNY",
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(
        Number(
            value || 0
        )
    );

}


function toast(
    message,
    type="success"
){

    const el =
        document.createElement(
            "div"
        );


    el.className =
        `toast ${type}`;


    el.textContent =
        message;


    toastStack.appendChild(
        el
    );


    setTimeout(
        () => {

            el.style.opacity =
                "0";

        },
        2700
    );


    setTimeout(
        () => {

            el.remove();

        },
        3100
    );

}


/* =========================================================
   04. DATE STATUS
========================================================= */

function daysUntil(
    dateString
){

    if(!dateString)
        return null;


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const target =
        new Date(
            dateString +
            "T00:00:00"
        );


    return Math.ceil(
        (
            target.getTime()
            -
            today.getTime()
        )
        /
        86400000
    );

}


function getStatus(row){

    if(
        row.is_deleted ===
        "已删除"
    ){

        return {
            text:"已删除",
            cls:"badge-deleted"
        };

    }


    const days =
        daysUntil(
            row.expire_date
        );


    if(
        days !== null
        &&
        days < 0
    ){

        return {
            text:"已过期",
            cls:"badge-expired"
        };

    }


    if(
        days !== null
        &&
        days <= 7
    ){

        return {

            text:
                days === 0
                ?
                "今天到期"
                :
                `${days} 天后到期`,

            cls:"badge-warning"

        };

    }


    return {
        text:"正常",
        cls:"badge-ok"
    };

}


/* =========================================================
   05. LOAD DATA
========================================================= */

async function loadData(
    showMessage=false
){

    dbStatus.textContent =
        "正在同步 Supabase 数据库…";


    const {
        data,
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .select("*")

        .order(
            "expire_date",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            error
        );


        dbStatus.textContent =
            "数据库连接失败";


        toast(
            "读取失败：" +
            error.message,
            "error"
        );


        return;

    }


    allRows =
        data || [];


    dbStatus.textContent =
        `数据库已连接 · ${allRows.length} 条记录`;


    updateStats();

    filterRows();


    if(showMessage){

        toast(
            "数据已刷新"
        );

    }

}


/* =========================================================
   06. STATS
========================================================= */

function updateStats(){

    const total =
        allRows.reduce(
            (
                sum,
                row
            ) =>
                sum
                +
                Number(
                    row.price || 0
                ),
            0
        );


    const deleted =
        allRows.filter(
            row =>
                row.is_deleted ===
                "已删除"
        ).length;


    $("#totalAmount").textContent =
        formatMoney(total);


    $("#totalCount").textContent =
        allRows.length;


    $("#activeCount").textContent =
        allRows.length
        -
        deleted;


    $("#deletedCount").textContent =
        deleted;

}


/* =========================================================
   07. DESKTOP TABLE
========================================================= */

function renderDesktop(rows){

    tableBody.innerHTML =
        "";


    desktopEmpty.style.display =
        rows.length
        ?
        "none"
        :
        "block";


    rows.forEach(
        (
            row,
            index
        ) => {


            const status =
                getStatus(row);


            const tr =
                document.createElement(
                    "tr"
                );


            if(

                "已删除"

                tr.style.opacity =
                    ".55";

            }


            tr.innerHTML =
            `

                <td class="row-index">
                    ${index + 1}
                </td>


                <td>
                    ${escapeHtml(
                        row.sell_date || "—"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        row.expire_date || "—"
                    )}
                </td>


                <td class="price">
                    ${escapeHtml(
                        formatMoney(
                            row.price
                        )
                    )}
                </td>


                <td class="email">
                    ${escapeHtml(
                        row.buyer_email || "—"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        row.project_no || "—"
                    )}
                </td>


                <td>

                    <span
                        class="
                            badge
                            ${status.cls}
                        "
                    >
                        ${escapeHtml(
                            status.text
                        )}
                    </span>

                </td>


                <td>
                    ${escapeHtml(
                        row.operator || "—"
                    )}
                </td>


                <td>

                    <div class="row-actions">


                        <button
                            class="
                                mini-btn
                                edit
                            "
                            data-action="edit"
                            data-id="${row.id}"
                        >
                            编辑
                        </button>


                        <button
                            class="mini-btn"
                            data-action="toggle"
                            data-id="${row.id}"
                        >

                            ${
                                row.is_deleted ===
                                "已删除"

                                ?
                                "恢复"

                                :
                                "标记删除"
                            }

                        </button>


                        <button
                            class="
                                mini-btn
                                danger
                            "
                            data-action="delete"
                            data-id="${row.id}"
                        >
                            永久删除
                        </button>


                    </div>

                </td>

            `;


            tableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   08. MOBILE CARDS
========================================================= */

function renderMobile(rows){

    mobileRecords.innerHTML =

/* =========================================================
   09. SEARCH + RENDER
========================================================= */

function filterRows(){

    const keyword =
        searchInput
        .value
        .trim()
        .toLowerCase();


    let rows =
        allRows;


    if(keyword){

        rows =
            allRows.filter(
                row => {


                    const text =
                        [

                            row.sell_date,
                            row.expire_date,
                            row.price,
                            row.buyer_email,
                            row.project_no,
                            row.operator,
                            row.is_deleted

                        ]

                        .join(" ")

                        .toLowerCase();


                    return text.includes(
                        keyword
                    );

                }
            );

    }


    renderDesktop(rows);

    renderMobile(rows);

}


searchInput.addEventListener(
    "input",

);

/* =========================================================
   12. ACTION DELEGATION
========================================================= */

function handleActionContainer(
    container
){

    container.addEventListener(
        "click",
        async event => {


            const btn =
                event.target.closest(
                    "[data-action]"
                );


            if(!btn)
                return;


            const id =
                Number(
                    btn.dataset.id
                );


            const action =
                btn.dataset.action;


            if(
                action ===
                "edit"
            ){

                openEdit(id);

            }


            if(
                action ===
                "toggle"
            ){

                await toggleDeleted(id);

            }


            if(
                action ===
                "delete"
            ){

                await permanentDelete(id);

            }

        }
    );

}


handleActionContainer(
    tableBody
);


handleActionContainer(
    mobileRecords
);


/* =========================================================
   13. SOFT DELETE
========================================================= */

async function toggleDeleted(id){

    const row =
        allRows.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if(!row)
        return;


    const next =
        row.is_deleted ===
        "已删除"

        ?
        "未删除"

        :
        "已删除";


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .update({
            is_deleted:next
        })

        .eq(
            "id",
            id
        );


    if(error){

        toast(
            "更新失败：" +
            error.message,
            "error"
        );

        return;

    }


    toast(
        next ===
        "已删除"

        ?
        "记录已标记删除"

        :
        "记录已恢复"
    );


    await loadData();

}


/* =========================================================
   14. PERMANENT DELETE
========================================================= */

async function permanentDelete(id){

    const ok =
        confirm(
            "确定永久删除这条记录吗？\n\n此操作无法恢复。"
        );


    if(!ok)
        return;


    const {
        error
    } =
        await sb

        .from(
            "sales_list"
        )

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        toast(
            "删除失败：" +
            error.message,
            "error"
        );

        return;

    }


    toast(
        "记录已永久删除"
    );


    await loadData();

}


/* =========================================================
   15. EDIT
========================================================= */

function openEdit(id){

    const row =
        allRows.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if(!row)
        return;


    editingId =
        id;


    $("#editSellDate").value =
        row.sell_date || "";


    $("#editExpireDate").value =
        row.expire_date || "";


    $("#editPrice").value =
        row.price ?? "";


    $("#editBuyerEmail").value =
        row.buyer_email || "";


    $("#editProjectNo").value =
        row.project_no || "";


    $("#editOperator").value =
        row.operator || "曾安南";


    $("#editModal")
    .classList
    .add(
        "show"
    );

}


function closeEdit(){

    editingId = null;


    $("#editModal")
    .classList
    .remove(
        "show"
    );

}


$("#closeModal")
.addEventListener(
    "click",
    closeEdit
);


$("#cancelEdit")
.addEventListener(
    "click",
    closeEdit
);


$("#editModal")
.addEventListener(
    "click",
    event => {

        if(
            event.target.id ===
            "editModal"
        ){

            closeEdit();

        }

    }
);


/* =========================================================
   16. SAVE EDIT
========================================================= */

$("#saveEdit")
.addEventListener(
    "click",
    async () => {


        if(
            editingId === null
        )
            return;


        const btn =
            $("#saveEdit");


        btn.disabled =
            true;


        btn.textContent =
            "正在保存…";


        const updates = {

            sell_date:
                $("#editSellDate").value,

            expire_date:
                $("#editExpireDate").value,

            price:
                Number(
                    $("#editPrice").value
                    ||
                    0
                ),

            buyer_email:
                $("#editBuyerEmail")
                .value
                .trim(),

            project_no:
                $("#editProjectNo")
                .value
                .trim(),

            operator:
                $("#editOperator").value

        };


        const {
            error
        } =
            await sb

            .from(
                "sales_list"
            )

            .update(
                updates
            )

            .eq(
                "id",
                editingId
            );


        btn.disabled =
            false;


        btn.textContent =
            "保存修改";


        if(error){

            toast(
                "保存失败：" +
                error.message,
                "error"
            );

            return;

        }


        closeEdit();


        toast(
            "修改已保存"
        );


        await loadData();

    }
);


/* =========================================================
   17. REFRESH
========================================================= */

$("#btnRefresh")
.addEventListener(
    "click",
    () =>
        loadData(true)
);


/* =========================================================
   18. CSV
========================================================= */

$("#btnExport")
.addEventListener(
    "click",
    () => {


        if(
            !allRows.length
        ){

            toast(
                "当前没有可以导出的数据",
                "error"
            );

            return;

        }


        const headers = [

            "序号",
            "售卖日期",
            "截止日期",
            "售价",
            "买家邮箱",
            "项目号",
            "是否已删除",
            "操作人"

        ];


        let csv =
            "\uFEFF"
            +
            headers.join(",")
            +
            "\n";


        allRows.forEach(
            (
                row,
                index
            ) => {


                const values = [

                    index + 1,

                    row.sell_date || "",

                    row.expire_date || "",

                    row.price || 0,

                    row.buyer_email || "",

                    row.project_no || "",

                    row.is_deleted || "",

                    row.operator || ""

                ];


                csv +=
                    values

                    .map(
                        value =>
                            `"${String(value)
                            .replaceAll(
                                '"',
                                '""'
                            )}"`
                    )

                    .join(",")

                    +
                    "\n";

            }
        );


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            "挣钱上三亚_销售记录.csv";


        document.body
        .appendChild(a);


        a.click();


        a.remove();


        URL.revokeObjectURL(
            url
        );


        toast(
            "CSV 导出完成"
        );

    }
);


/* =========================================================
   19. INIT
========================================================= */

$("#year").textContent =
    new Date()
    .getFullYear();


window.addEventListener(
    "load",
    async () => {

        await loadData();

    }
);

</script>
